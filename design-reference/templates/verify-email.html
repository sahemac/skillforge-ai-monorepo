<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification Email - SkillForge AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="flex justify-center">
                <div class="h-12 w-12 bg-indigo-600 rounded-lg flex items-center justify-center">
                    <i data-feather="mail" class="text-white"></i>
                </div>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Vérification d'email
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Entrez le code OTP envoyé à votre adresse email
            </p>
        </div>

        <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
                <form class="space-y-6" action="/api/v1/auth/verify-email" method="POST">
                    <div>
                        <div class="flex justify-between">
                            <label for="otp" class="block text-sm font-medium text-gray-700">
                                Code OTP
                            </label>
                            <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
                                Renvoyer le code
                            </a>
                        </div>
                        <div class="mt-1 flex space-x-4">
                            <input type="text" name="otp1" maxlength="1" required 
                                class="w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            <input type="text" name="otp2" maxlength="1" required 
                                class="w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            <input type="text" name="otp3" maxlength="1" required 
                                class="w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            <input type="text" name="otp4" maxlength="1" required 
                                class="w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            <input type="text" name="otp5" maxlength="1" required 
                                class="w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            <input type="text" name="otp6" maxlength="1" required 
                                class="w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                    </div>

                    <div>
                        <button type="submit" 
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            Vérifier le code
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        feather.replace();
    </script>
</body>
</html>
