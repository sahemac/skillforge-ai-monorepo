<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafraîchissement Token - SkillForge AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full p-8">
            <div class="text-center mb-8">
                <div class="h-16 w-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-feather="refresh-cw" class="text-indigo-600 w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Session renouvelée</h2>
                <p class="mt-2 text-gray-600">Votre session a été rafraîchie automatiquement. Vous pouvez maintenant continuer à utiliser l'application.</p>
            </div>
            
            <div class="bg-white shadow rounded-lg p-6">
                <div class="flex items-center space-x-4 mb-4">
                    <div class="flex-shrink-0">
                        <div class="h-10 w-10 bg-green-100 rounded-full flex items-center justify-center">
                            <i data-feather="check" class="text-green-600 w-5 h-5"></i>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-lg font-medium text-gray-900">Token actualisé</h3>
                        <p class="text-sm text-gray-500">Nouveau token généré avec succès</p>
                    </div>
                </div>
                
                <div class="mt-6">
                    <button onclick="window.close()" 
                        class="w-full flex justify-center items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        <i data-feather="x" class="w-4 h-4 mr-2"></i>
                        Fermer cette fenêtre
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        feather.replace();
    </script>
</body>
</html>
