swagger: "2.0"
info:
  title: "SkillForge AI API Gateway - Test"
  description: "API Gateway pour SkillForge AI (Version Test - User Service Only)"
  version: "1.0.0"
host: "skillforge-api-staging-${project_id}.ew.gateway.dev"
schemes:
  - "https"
produces:
  - "application/json"

# No authentication for test version

paths:
  # Root endpoint
  "/":
    get:
      summary: "Root endpoint"
      operationId: "root"
      tags:
        - "General"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Service info"

  # Health check endpoints (no auth required)
  "/health":
    get:
      summary: "Service health check"
      operationId: "healthCheck"
      tags:
        - "Health"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Service is healthy"

  # Metrics endpoint
  "/metrics":
    get:
      summary: "Prometheus metrics"
      operationId: "metrics"
      tags:
        - "Monitoring"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Prometheus metrics"

  # Cache info endpoint
  "/cache/info":
    get:
      summary: "Cache information"
      operationId: "cacheInfo"
      tags:
        - "Monitoring"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Cache information"

  # User Service Routes
  "/api/v1/users":
    get:
      summary: "List users"
      operationId: "listUsers"
      tags:
        - "Users"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "List of users"
        401:
          description: "Unauthorized"
        429:
          description: "Rate limit exceeded"

  "/api/v1/users/{user_id}":
    get:
      summary: "Get user by ID"
      operationId: "getUserById"
      tags:
        - "Users"
      parameters:
        - name: "user_id"
          in: "path"
          required: true
          type: "string"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "User details"
        404:
          description: "User not found"
        401:
          description: "Unauthorized"

  # Authentication Routes
  "/api/v1/auth/register":
    post:
      summary: "User registration"
      operationId: "register"
      tags:
        - "Authentication"
      parameters:
        - name: "body"
          in: "body"
          required: true
          schema:
            type: object
            required:
              - email
              - password
              - username
              - first_name
              - last_name
            properties:
              email:
                type: string
                format: email
              password:
                type: string
              username:
                type: string
              first_name:
                type: string
              last_name:
                type: string
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        201:
          description: "User created"
        400:
          description: "Invalid input"

  "/api/v1/auth/login":
    post:
      summary: "User login"
      operationId: "login"
      tags:
        - "Authentication"
      parameters:
        - name: "body"
          in: "body"
          required: true
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                format: email
              password:
                type: string
              remember_me:
                type: boolean
                default: false
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Login successful"
        401:
          description: "Invalid credentials"

  "/api/v1/auth/refresh":
    post:
      summary: "Refresh access token"
      operationId: "refreshToken"
      tags:
        - "Authentication"
      parameters:
        - name: "body"
          in: "body"
          required: true
          schema:
            type: object
            required:
              - refresh_token
            properties:
              refresh_token:
                type: string
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Token refreshed"
        401:
          description: "Invalid token"

  "/api/v1/auth/logout":
    post:
      summary: "User logout"
      operationId: "logout"
      tags:
        - "Authentication"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Logged out successfully"

  "/api/v1/auth/logout-all":
    post:
      summary: "Logout from all sessions"
      operationId: "logoutAll"
      tags:
        - "Authentication"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Logged out from all sessions"

  "/api/v1/auth/verify-email-request":
    post:
      summary: "Request email verification"
      operationId: "verifyEmailRequest"
      tags:
        - "Authentication"
      parameters:
        - name: "body"
          in: "body"
          required: true
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Verification email sent"

  "/api/v1/auth/verify-email":
    post:
      summary: "Confirm email verification"
      operationId: "verifyEmail"
      tags:
        - "Authentication"
      parameters:
        - name: "body"
          in: "body"
          required: true
          schema:
            type: object
            required:
              - token
            properties:
              token:
                type: string
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Email verified"
        400:
          description: "Invalid token"

  "/api/v1/auth/password-reset-request":
    post:
      summary: "Request password reset"
      operationId: "passwordResetRequest"
      tags:
        - "Authentication"
      parameters:
        - name: "body"
          in: "body"
          required: true
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Reset email sent"

  "/api/v1/auth/password-reset-confirm":
    post:
      summary: "Confirm password reset"
      operationId: "passwordResetConfirm"
      tags:
        - "Authentication"
      parameters:
        - name: "body"
          in: "body"
          required: true
          schema:
            type: object
            required:
              - token
              - new_password
            properties:
              token:
                type: string
              new_password:
                type: string
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Password reset successful"
        400:
          description: "Invalid token"

  # API Gateway health check endpoint
  "/api/v1/auth/health":
    get:
      summary: "Auth service health check"
      operationId: "authHealthCheck"
      tags:
        - "Health"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "CONSTANT_ADDRESS"
        path: "/health"
      responses:
        200:
          description: "Auth service is healthy"

  # Companies routes (for future expansion)
  "/api/v1/companies":
    get:
      summary: "List companies"
      operationId: "listCompanies"
      tags:
        - "Companies"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "List of companies"
        401:
          description: "Unauthorized"

  "/api/v1/companies/{company_id}":
    get:
      summary: "Get company by ID"
      operationId: "getCompanyById"
      tags:
        - "Companies"
      parameters:
        - name: "company_id"
          in: "path"
          required: true
          type: "string"
      x-google-backend:
        address: "${user_service_url}"
        path_translation: "APPEND_PATH_TO_ADDRESS"
      responses:
        200:
          description: "Company details"
        404:
          description: "Company not found"
        401:
          description: "Unauthorized"

# Rate limiting disabled for test version

# Global parameters
parameters:
  user_id:
    name: "user_id"
    in: "path"
    description: "User ID"
    required: true
    type: "string"
  company_id:
    name: "company_id"
    in: "path"
    description: "Company ID"
    required: true
    type: "string"