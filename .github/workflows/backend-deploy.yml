name: Backend Services Deployment

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/backend/user-service/**'
      - 'apps/backend/company-service/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/backend/user-service/**'
      - 'apps/backend/company-service/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      services:
        description: 'Services to deploy (comma-separated or "all")'
        required: true
        default: 'all'
        type: string
      run_migrations:
        description: 'Run database migrations'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: gcr.io
  PROJECT_ID: skillforge-ai-mvp-25
  REGION: europe-west1
  PYTHON_VERSION: '3.11'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.changes.outputs.user-service }}
      company-service: ${{ steps.changes.outputs.company-service }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ steps.set-env.outputs.environment }}
      run_migrations: ${{ steps.set-migrations.outputs.run_migrations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            user-service:
              - 'apps/backend/user-service/**'
            company-service:
              - 'apps/backend/company-service/**'
      - name: Set environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi
      - name: Set migrations flag
        id: set-migrations
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_migrations=${{ github.event.inputs.run_migrations }}" >> $GITHUB_OUTPUT
          else
            echo "run_migrations=true" >> $GITHUB_OUTPUT
          fi
      - name: Set matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.services }}" != "all" ]]; then
            IFS=',' read -ra SERVICES <<< "${{ github.event.inputs.services }}"
            matrix_services="["
            for service in "${SERVICES[@]}"; do
              service=$(echo $service | xargs)
              matrix_services="$matrix_services\"$service\","
            done
            matrix_services="${matrix_services%,}]"
          else
            matrix_services="["
            if [[ "${{ steps.changes.outputs.user-service }}" == "true" || "${{ github.event.inputs.services }}" == "all" ]]; then
              matrix_services="${matrix_services}\"user-service\","
            fi
            if [[ "${{ steps.changes.outputs.company-service }}" == "true" || "${{ github.event.inputs.services }}" == "all" ]]; then
              matrix_services="${matrix_services}\"company-service\","
            fi
            matrix_services="${matrix_services%,}]"
          fi

          if [[ "$matrix_services" == "[]" ]]; then
            matrix_services='["user-service"]'
          fi

          echo "matrix={\"service\":$matrix_services}" >> $GITHUB_OUTPUT
          echo "Services to deploy: $matrix_services"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"service":[]}'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install security tools
        run: |
          pip install bandit safety semgrep
      - name: Run Bandit security scan
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          if [ -f .bandit ]; then
            bandit -r app/ -f json -o bandit-report.json || true
            bandit -r app/ -f txt || true
          else
            bandit -r app/ -f json -o bandit-report.json --skip B101,B601,B602,B603,B605,B607 || true
            bandit -r app/ -f txt --skip B101,B601,B602,B603,B605,B607 || true
          fi
      - name: Run Safety check
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          safety check --json --output safety-report.json || true
          safety check
      - name: Run Semgrep scan
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          semgrep --config=auto --json --output=semgrep-report.json app/ || true
      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ matrix.service }}
          path: |
            apps/backend/${{ matrix.service }}/bandit-report.json
            apps/backend/${{ matrix.service }}/safety-report.json
            apps/backend/${{ matrix.service }}/semgrep-report.json

  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"service":[]}'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.service }}-${{ hashFiles('apps/backend/${{ matrix.service }}/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.service }}-
            ${{ runner.os }}-pip-
      - name: Install dependencies
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov black flake8 mypy psycopg2-binary
      - name: Lint with flake8
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Auto-format with black
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          echo "🎨 Auto-formatting code with Black..."
          black app/ || echo "⚠️ Black formatting applied"
          echo "✅ Code formatting completed"
      - name: Type check with mypy
        working-directory: apps/backend/${{ matrix.service }}
        continue-on-error: true
        run: |
          mypy app/ --ignore-missing-imports
      - name: Setup test database
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          cat > .env.test << EOF
          DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL=redis://localhost:6379
          SECRET_KEY=test_secret_key_for_testing_only
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          ENVIRONMENT=testing
          EOF
      - name: Run database migrations
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          if [ -f alembic.ini ]; then
            export DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db
            alembic upgrade head
          fi
      - name: Run tests with coverage
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          export DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db
          export REDIS_URL=redis://localhost:6379
          pytest app/tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing
      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/backend/${{ matrix.service }}/coverage.xml
          flags: backend-${{ matrix.service }}
          name: backend-${{ matrix.service }}-coverage

  database-migration:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.run_migrations == 'true' && needs.detect-changes.outputs.matrix != '{"service":[]}'
    environment: ${{ needs.detect-changes.outputs.environment }}
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac/skillforge-ai-monorepo'
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Install dependencies
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
      - name: Setup Cloud SQL Proxy
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy

          # Start Cloud SQL Proxy in background
          ./cloud_sql_proxy -instances=$PROJECT_ID:$REGION:skillforge-pg-instance-${{ needs.detect-changes.outputs.environment }}=tcp:5432 &
          sleep 10

          # Verify connection
          pg_isready -h localhost -p 5432 -U $(echo ${{ secrets.DATABASE_URL }} | awk -F'[:/@]' '{print $4}')
      - name: Run database migration
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          if [ -f alembic.ini ]; then
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            echo "Running Alembic migration..."
            alembic upgrade head
            echo "Migration completed successfully"
          else
            echo "No alembic.ini found, skipping migration"
          fi

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [detect-changes, test, database-migration]
    if: always() && needs.detect-changes.outputs.matrix != '{"service":[]}'
    environment: ${{ needs.detect-changes.outputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac/skillforge-ai-monorepo'
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker gcr.io
      - name: Create Dockerfile
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          cat > Dockerfile << 'EOF'
          # Multi-stage build for Python service
          FROM python:3.11-slim as builder

          WORKDIR /app

          # Install system dependencies
          RUN apt-get update && apt-get install -y \
              build-essential \
              libpq-dev \
              curl \
              && rm -rf /var/lib/apt/lists/*

          # Install Python dependencies
          COPY requirements.txt .
          RUN pip install --no-cache-dir --user -r requirements.txt

          # Production stage
          FROM python:3.11-slim as production

          # Security: Create non-root user
          RUN groupadd -r appuser && useradd -r -g appuser appuser

          # Install runtime dependencies only
          RUN apt-get update && apt-get install -y \
              libpq5 \
              curl \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /app

          # Copy Python packages from builder
          COPY --from=builder /root/.local /home/appuser/.local

          # Copy application code
          COPY --chown=appuser:appuser app/ ./app/
          COPY --chown=appuser:appuser alembic/ ./alembic/ 2>/dev/null || true
          COPY --chown=appuser:appuser alembic.ini . 2>/dev/null || true
          COPY --chown=appuser:appuser run_migration.py . 2>/dev/null || true

          # Set environment variables
          ENV PATH=/home/appuser/.local/bin:$PATH
          ENV PYTHONPATH=/app
          ENV PYTHONUNBUFFERED=1
          ENV PYTHONDONTWRITEBYTECODE=1

          # Switch to non-root user
          USER appuser

          # Expose port
          EXPOSE 8000

          # Health check
          HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
              CMD curl -f http://localhost:8000/health || exit 1

          # Start the application
          CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF
      - name: Build and push Docker image
        working-directory: apps/backend/${{ matrix.service }}
        run: |
          IMAGE_TAG="$REGISTRY/$PROJECT_ID/skillforge-${{ matrix.service }}:${{ github.sha }}"
          LATEST_TAG="$REGISTRY/$PROJECT_ID/skillforge-${{ matrix.service }}:latest"
          ENV_TAG="$REGISTRY/$PROJECT_ID/skillforge-${{ matrix.service }}:${{ needs.detect-changes.outputs.environment }}"

          docker build -t $IMAGE_TAG -t $LATEST_TAG -t $ENV_TAG .
          docker push $IMAGE_TAG
          docker push $LATEST_TAG
          docker push $ENV_TAG

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
      - name: Deploy to Cloud Run
        run: |
          SERVICE_NAME="skillforge-${{ matrix.service }}-${{ needs.detect-changes.outputs.environment }}"

          gcloud run deploy $SERVICE_NAME \
            --image=${{ env.IMAGE_TAG }} \
            --platform=managed \
            --region=$REGION \
            --allow-unauthenticated \
            --port=8000 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=100 \
            --concurrency=80 \
            --timeout=300 \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }},REDIS_URL=${{ secrets.REDIS_URL }},SECRET_KEY=${{ secrets.SECRET_KEY }},ENVIRONMENT=${{ needs.detect-changes.outputs.environment }}" \
            --set-secrets="JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}:latest" \
            --labels="app=skillforge-backend,service=${{ matrix.service }},environment=${{ needs.detect-changes.outputs.environment }}" \
            --tag="${{ needs.detect-changes.outputs.environment }}" \
            --revision-suffix="${{ github.sha }}-${{ github.run_number }}" \
            --no-traffic

          # Get the new revision URL
          NEW_REVISION_URL=$(gcloud run services describe $SERVICE_NAME \
            --platform=managed \
            --region=$REGION \
            --format="value(status.traffic[0].url)" \
            --filter="metadata.name:$SERVICE_NAME")

          echo "NEW_REVISION_URL=$NEW_REVISION_URL" >> $GITHUB_ENV
          echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV
      - name: Health check new revision
        run: |
          echo "Performing health check on new revision..."

          # Wait for service to be ready
          sleep 60

          MAX_ATTEMPTS=15
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."

            if curl -f -s "${{ env.NEW_REVISION_URL }}/health" > /dev/null; then
              echo "✅ Health check passed!"
              break
            elif curl -f -s "${{ env.NEW_REVISION_URL }}/docs" > /dev/null; then
              echo "✅ Service is responding (docs endpoint)!"
              break
            else
              echo "❌ Health check failed, retrying in 30 seconds..."
              sleep 30
              ((ATTEMPT++))
            fi
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "🚨 Health check failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi
      - name: Database connectivity test
        run: |
          echo "Testing database connectivity..."

          MAX_ATTEMPTS=5
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Database connectivity test attempt $ATTEMPT/$MAX_ATTEMPTS..."

            if curl -f -s "${{ env.NEW_REVISION_URL }}/health/db" > /dev/null; then
              echo "✅ Database connectivity test passed!"
              break
            else
              echo "❌ Database connectivity test failed, retrying in 10 seconds..."
              sleep 10
              ((ATTEMPT++))
            fi
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "⚠️ Database connectivity test failed, but continuing..."
          fi
      - name: Gradual traffic rollout
        run: |
          if [[ "${{ needs.detect-changes.outputs.environment }}" == "production" ]]; then
            echo "🚀 Starting gradual rollout to production..."

            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=10"
            echo "✅ 10% traffic routed to new revision"
            sleep 180

            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=50"
            echo "✅ 50% traffic routed to new revision"
            sleep 180

            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=100"
            echo "✅ 100% traffic routed to new revision"
          else
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=100"
            echo "✅ All traffic routed to new revision in staging"
          fi
      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform=managed \
            --region=$REGION \
            --format="value(status.url)")
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
          echo "🌐 Service deployed at: $SERVICE_URL"
      - name: API integration test
        run: |
          echo "🔍 Running API integration tests..."

          echo "Testing API documentation endpoint..."
          curl -f -s "${{ env.SERVICE_URL }}/docs" > /dev/null && echo "✅ Docs endpoint OK" || echo "❌ Docs endpoint failed"

          echo "Testing API OpenAPI spec..."
          curl -f -s "${{ env.SERVICE_URL }}/openapi.json" > /dev/null && echo "✅ OpenAPI spec OK" || echo "❌ OpenAPI spec failed"

          RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}' ${{ env.SERVICE_URL }}/docs)
          echo "Response time: ${RESPONSE_TIME}s"

          if (( $(echo "$RESPONSE_TIME > 5" | bc -l) )); then
            echo "⚠️ Warning: Response time is slow (${RESPONSE_TIME}s)"
          else
            echo "✅ Response time is acceptable (${RESPONSE_TIME}s)"
          fi
      - name: Cleanup old revisions
        run: |
          echo "🧹 Cleaning up old revisions..."

          gcloud run revisions list \
            --service=${{ env.SERVICE_NAME }} \
            --region=$REGION \
            --format="value(metadata.name)" \
            --sort-by="~metadata.creationTimestamp" \
            --limit=100 | tail -n +6 | while read revision; do
            echo "Deleting old revision: $revision"
            gcloud run revisions delete $revision --region=$REGION --quiet || true
          done

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-deploy]
    if: failure() && needs.detect-changes.outputs.environment == 'production'
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac/skillforge-ai-monorepo'
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Rollback to previous revision
        run: |
          echo "🔄 Rolling back to previous revision..."

          for service in user-service company-service; do
            SERVICE_NAME="skillforge-$service-production"

            PREVIOUS_REVISION=$(gcloud run revisions list \
              --service=$SERVICE_NAME \
              --region=$REGION \
              --format="value(metadata.name)" \
              --sort-by="~metadata.creationTimestamp" \
              --limit=2 | tail -1)

            if [ -n "$PREVIOUS_REVISION" ]; then
              echo "Rolling back $SERVICE_NAME to $PREVIOUS_REVISION"
              gcloud run services update-traffic $SERVICE_NAME \
                --region=$REGION \
                --to-revisions="$PREVIOUS_REVISION=100" \
                --quiet
            fi
          done
      - name: Log rollback completion
        run: |
          echo "🔄 Backend Production Rollback Completed"
          echo "Reason: Deployment failure detected"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date)"
