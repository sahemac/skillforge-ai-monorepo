name: E2E Tests - Staging Environment

on:
  workflow_call:
    inputs:
      base_url:
        description: 'Base URL to test'
        required: false
        type: string
        default: 'https://skillforge-ai.emacsah.com'
      api_url:
        description: 'API base URL'
        required: false
        type: string
        default: 'https://skillforge-user-service-staging-721427084268.europe-west1.run.app'
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test'
        required: false
        type: string
        default: 'https://skillforge-ai.emacsah.com'
      api_url:
        description: 'API base URL'
        required: false
        type: string
        default: 'https://skillforge-user-service-staging-721427084268.europe-west1.run.app'
      browser:
        description: 'Browser to use for tests'
        required: false
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
        default: chromium

  schedule:
    # Run E2E tests daily at 6 AM UTC
    - cron: '0 6 * * *'

permissions:
  contents: read
  checks: write

env:
  BASE_URL: ${{ inputs.base_url || 'https://skillforge-ai.emacsah.com' }}
  API_URL: ${{ inputs.api_url || 'https://skillforge-user-service-staging-721427084268.europe-west1.run.app' }}

jobs:
  # ===== Tests E2E Frontend =====
  e2e-frontend:
    name: E2E Tests - Frontend Critical Paths
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: ${{ inputs.browser == 'all' && fromJSON('["chromium", "firefox", "webkit"]') || fromJSON(format('["{0}"]', inputs.browser || 'chromium')) }}
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-e2e-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-e2e-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Wait for service to be ready
        run: |
          echo "⏳ Waiting for service to be ready..."
          MAX_RETRIES=10
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.BASE_URL }}/health" || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "✅ Service is ready"
              break
            else
              echo "⏳ Service not ready (HTTP $STATUS), waiting... ($((RETRY_COUNT + 1))/$MAX_RETRIES)"
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 10
            fi
          done

      - name: Run Playwright E2E tests
        working-directory: apps/frontend/shell
        run: |
          pnpm exec playwright test \
            --project=${{ matrix.browser }} \
            --shard=${{ matrix.shard }}/2 \
            --reporter=html,json,junit
        env:
          BASE_URL: ${{ env.BASE_URL }}
          API_URL: ${{ env.API_URL }}
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: apps/frontend/shell/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: apps/frontend/shell/test-results/
          retention-days: 7

  # ===== Tests E2E API =====
  e2e-api:
    name: E2E Tests - API Endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test User Service API Endpoints
        run: |
          echo "🧪 Testing User Service API endpoints..."

          # Test health endpoint
          echo "Testing /health..."
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.API_URL }}/health")
          if [ "$HEALTH" != "200" ]; then
            echo "❌ Health check failed (HTTP $HEALTH)"
            exit 1
          fi
          echo "✅ Health endpoint OK"

          # Test docs endpoint
          echo "Testing /docs..."
          DOCS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.API_URL }}/docs")
          if [ "$DOCS" != "200" ]; then
            echo "⚠️ Docs endpoint not accessible (HTTP $DOCS)"
          else
            echo "✅ Docs endpoint OK"
          fi

          # Test API versioning
          echo "Testing /api/v1/..."
          VERSION=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.API_URL }}/api/v1/users/" || echo "000")
          if [ "$VERSION" = "404" ] || [ "$VERSION" = "401" ] || [ "$VERSION" = "200" ]; then
            echo "✅ API versioning endpoint accessible (HTTP $VERSION)"
          else
            echo "⚠️ API endpoint returned HTTP $VERSION"
          fi

      - name: Test User Registration Flow (API)
        run: |
          echo "🧪 Testing user registration flow..."

          # Generate random email
          TIMESTAMP=$(date +%s)
          TEST_EMAIL="e2e-test-${TIMESTAMP}@example.com"

          # Test registration endpoint
          RESPONSE=$(curl -s -X POST "${{ env.API_URL }}/api/v1/auth/register" \
            -H "Content-Type: application/json" \
            -d "{
              \"email\": \"${TEST_EMAIL}\",
              \"password\": \"TestPassword123!\",
              \"full_name\": \"E2E Test User\",
              \"user_type\": \"learner\"
            }" \
            -o /tmp/register_response.json \
            -w "%{http_code}")

          echo "Registration response: HTTP $RESPONSE"
          cat /tmp/register_response.json || true

          # Accept 201 (Created) or 400 (if validation fails) or 409 (if already exists)
          if [ "$RESPONSE" = "201" ] || [ "$RESPONSE" = "400" ] || [ "$RESPONSE" = "409" ]; then
            echo "✅ Registration endpoint working (HTTP $RESPONSE)"
          else
            echo "⚠️ Unexpected registration response: HTTP $RESPONSE"
          fi

      - name: Test Company Service API
        run: |
          echo "🧪 Testing Company Service API..."

          COMPANY_API="https://skillforge-company-service-staging-721427084268.europe-west1.run.app"

          # Test health
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "${COMPANY_API}/health")
          if [ "$HEALTH" = "200" ]; then
            echo "✅ Company Service health OK"
          else
            echo "⚠️ Company Service health check failed (HTTP $HEALTH)"
          fi

  # ===== Tests de Performance =====
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test page load performance
        run: |
          echo "⚡ Testing page load performance..."

          # Test homepage
          HOMEPAGE_TIME=$(curl -o /dev/null -s -w '%{time_total}' "${{ env.BASE_URL }}/")
          echo "Homepage load time: ${HOMEPAGE_TIME}s"

          # Test API response time
          API_TIME=$(curl -o /dev/null -s -w '%{time_total}' "${{ env.API_URL }}/health")
          echo "API health response time: ${API_TIME}s"

          # Performance thresholds
          if (( $(echo "$HOMEPAGE_TIME > 5.0" | bc -l) )); then
            echo "⚠️ Homepage load time is slow: ${HOMEPAGE_TIME}s"
          else
            echo "✅ Homepage load time acceptable: ${HOMEPAGE_TIME}s"
          fi

          if (( $(echo "$API_TIME > 2.0" | bc -l) )); then
            echo "⚠️ API response time is slow: ${API_TIME}s"
          else
            echo "✅ API response time acceptable: ${API_TIME}s"
          fi

      - name: Test concurrent requests
        run: |
          echo "🔄 Testing concurrent requests..."

          # Send 10 concurrent requests
          for i in {1..10}; do
            curl -s -o /dev/null "${{ env.BASE_URL }}/" &
          done
          wait

          echo "✅ Concurrent requests completed"

  # ===== Résumé des Tests =====
  test-summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-frontend, e2e-api, performance-tests]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Generate test summary
        run: |
          echo "# 🧪 E2E Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "**Base URL**: ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**API URL**: ${{ env.API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend E2E | ${{ needs.e2e-frontend.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API E2E | ${{ needs.e2e-api.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.e2e-frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e-api.result }}" == "failure" ]] || \
             [[ "${{ needs.performance-tests.result }}" == "failure" ]]; then
            echo "❌ Some E2E tests failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required**: Review failed tests before deploying to production" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All E2E tests passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Application is ready for production deployment." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Slack on Failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"❌ E2E tests failed in staging\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"❌ E2E Tests Failed\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Environment:*\\nStaging\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Triggered by:*\\n${{ github.actor }}\"}
                  ]
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {\"type\": \"plain_text\", \"text\": \"View Test Results\"},
                      \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                    }
                  ]
                }
              ]
            }"

      - name: Notify Slack on Success
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"✅ E2E tests passed in staging\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"✅ E2E Tests Passed\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Environment:*\\nStaging\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Status:*\\nAll tests passed\"}
                  ]
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"Application is validated and ready for production deployment.\"
                  }
                }
              ]
            }"
