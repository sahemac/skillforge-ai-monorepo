name: Deploy Project Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/backend/project-service/**'
      - '.github/workflows/deploy-project-service.yml'
  workflow_dispatch:

env:
  PROJECT_ID: skillforge-ai-mvp-25
  REGION: europe-west1
  SERVICE: project-service-staging
  REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY: skillforge-ai-registry
  IMAGE: project-service

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: 'access_token'
          access_token_lifetime: '1200s'
          audience: 'https://github.com/sahemac/skillforge-ai-monorepo'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and Push Docker image
        run: |
          docker build \
            -f apps/backend/project-service/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
            .
          
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

      - name: Create Cloud Run Service (if not exists)
        run: |
          if ! gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} >/dev/null 2>&1; then
            echo "Creating new Cloud Run service..."
            gcloud run deploy ${{ env.SERVICE }} \
              --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
              --region=${{ env.REGION }} \
              --platform=managed \
              --port=8080 \
              --memory=1Gi \
              --cpu=2 \
              --timeout=300 \
              --concurrency=1000 \
              --max-instances=10 \
              --min-instances=1 \
              --service-account=skillforge-cloud-run@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
              --set-env-vars="SERVICE_NAME=${{ env.SERVICE }}" \
              --set-env-vars="ENVIRONMENT=staging" \
              --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }}" \
              --set-env-vars="GCS_BUCKET_NAME=skillforge-project-deliverables" \
              --set-env-vars="INSTANCE_CONNECTION_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:skillforge-pg-instance-staging" \
              --set-env-vars="POSTGRES_DB=skillforge_projects" \
              --set-env-vars="POSTGRES_USER=skillforge_user" \
              --set-env-vars="POSTGRES_HOST=127.0.0.1" \
              --set-env-vars="POSTGRES_PORT=5432" \
              --set-env-vars="USER_SERVICE_URL=https://user-service-staging-h7tqz5lkcq-ew.a.run.app" \
              --set-env-vars="COMPANY_SERVICE_URL=https://company-service-staging-h7tqz5lkcq-ew.a.run.app" \
              --set-secrets="POSTGRES_PASSWORD=project-service-db-password:latest" \
              --set-secrets="JWT_SECRET_KEY=jwt-secret-key:latest" \
              --set-secrets="SECRET_KEY=api-secret-key:latest" \
              --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:skillforge-pg-instance-staging \
              --vpc-connector=skillforge-vpc-connector \
              --vpc-egress=private-ranges-only \
              --ingress=internal \
              --no-allow-unauthenticated
          else
            echo "Cloud Run service already exists, updating..."
          fi

      - name: Update Cloud Run Service
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed

      - name: Run Database Migrations
        run: |
          echo "Running database migrations..."
          gcloud run jobs create migrate-project-db-${{ github.run_number }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --command="alembic" \
            --args="upgrade,head" \
            --set-env-vars="DATABASE_URL=postgresql+asyncpg://skillforge_user:$(gcloud secrets versions access latest --secret=project-service-db-password)@127.0.0.1:5432/skillforge_projects" \
            --set-env-vars="INSTANCE_CONNECTION_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:skillforge-pg-instance-staging" \
            --vpc-connector=skillforge-vpc-connector \
            --vpc-egress=private-ranges-only \
            --service-account=skillforge-cloud-run@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:skillforge-pg-instance-staging \
            --max-retries=3 \
            --parallelism=1 \
            --task-timeout=600 || true
          
          gcloud run jobs execute migrate-project-db-${{ github.run_number }} \
            --region=${{ env.REGION }} \
            --wait || echo "Migration job failed, continuing..."

      - name: Grant API Gateway Access
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --member="serviceAccount:api-gateway-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"

      - name: Get Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "Service deployed at: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Health Check
        run: |
          sleep 30
          curl -f "${{ env.SERVICE_URL }}/health" || echo "Health check failed"

      - name: Summary
        run: |
          echo "### 🚀 Project Service Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ env.SERVICE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ env.SERVICE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment completed successfully!" >> $GITHUB_STEP_SUMMARY