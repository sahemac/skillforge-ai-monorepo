name: "Deploy - Project Service"

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/backend/project-service/**'
      - '.github/workflows/deploy-project-service.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - staging
          - production
        default: staging
      skip_migration:
        description: 'Skip database migration'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

jobs:
  deploy-project-service:
    name: Deploy Project Service
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: 'project-service'
      environment: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
      build_type: 'backend'
      skip_migration: ${{ inputs.skip_migration || false }}
      skip_tests: false
      force_deploy: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_CICD_SERVICE_ACCOUNT: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
      DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
      DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}