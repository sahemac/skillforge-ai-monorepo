name: Auto-Deploy to Staging (on develop push)

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'packages/**'
      - '.github/workflows/backend-deploy-optimized.yml'
      - '.github/workflows/frontend-deploy.yml'
      - '.github/workflows/deploy-staging-auto.yml'

# Prevent concurrent deployments to staging
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ENVIRONMENT: staging
  GCP_PROJECT_ID: skillforge-ai-mvp-25
  GCP_REGION: europe-west1

jobs:
  # ===== Détection des changements =====
  detect-changes:
    name: Detect Changes & Plan Deployment
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      packages_changed: ${{ steps.filter.outputs.packages }}
      deployment_needed: ${{ steps.check.outputs.needed }}
      commit_sha: ${{ steps.commit.outputs.sha }}
      commit_message: ${{ steps.commit.outputs.message }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get commit info
        id: commit
        run: |
          echo "sha=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            frontend:
              - 'apps/frontend/**'
            packages:
              - 'packages/**'

      - name: Check if deployment needed
        id: check
        run: |
          if [[ "${{ steps.filter.outputs.backend }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.frontend }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.packages }}" == "true" ]]; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "✅ Deployment needed"
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No deployment needed"
          fi

      - name: Display deployment plan
        run: |
          echo "## 📋 Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: develop" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ steps.commit.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Message**: ${{ steps.commit.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Services | ${{ steps.filter.outputs.backend == 'true' && '✅ Yes' || '⏭️ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Apps | ${{ steps.filter.outputs.frontend == 'true' && '✅ Yes' || '⏭️ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared Packages | ${{ steps.filter.outputs.packages == 'true' && '✅ Yes' || '⏭️ No' }} |" >> $GITHUB_STEP_SUMMARY

  # ===== Déploiement Backend =====
  deploy-backend:
    name: Deploy Backend Services to Staging
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true' && needs.detect-changes.outputs.deployment_needed == 'true'
    uses: ./.github/workflows/backend-deploy-optimized.yml
    secrets: inherit
    with:
      environment: staging
      run_migrations: true

  # ===== Déploiement Frontend =====
  deploy-frontend:
    name: Deploy Frontend Apps to Staging
    needs: detect-changes
    if: |
      (needs.detect-changes.outputs.frontend_changed == 'true' ||
       needs.detect-changes.outputs.packages_changed == 'true') &&
      needs.detect-changes.outputs.deployment_needed == 'true'
    uses: ./.github/workflows/frontend-deploy.yml
    secrets: inherit

  # ===== Tests de Validation Post-Déploiement =====
  smoke-tests-backend:
    name: Smoke Tests - Backend APIs
    needs: [detect-changes, deploy-backend]
    if: always() && needs.deploy-backend.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: user-service
            url: https://skillforge-user-service-staging-721427084268.europe-west1.run.app
          - name: company-service
            url: https://skillforge-company-service-staging-721427084268.europe-west1.run.app

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke tests for ${{ matrix.service.name }}
        run: |
          echo "🧪 Testing ${{ matrix.service.name }}..."

          # Health check
          HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ matrix.service.url }}/health" || echo "000")

          if [ "$HEALTH_RESPONSE" = "200" ]; then
            echo "✅ Health check passed for ${{ matrix.service.name }}"
          else
            echo "❌ Health check failed for ${{ matrix.service.name }} (HTTP $HEALTH_RESPONSE)"
            exit 1
          fi

  smoke-tests-frontend:
    name: Smoke Tests - Frontend Shell
    needs: [detect-changes, deploy-frontend]
    if: always() && needs.deploy-frontend.result == 'success'
    uses: ./.github/workflows/smoke-tests.yml
    with:
      environment: staging
      service_url: https://skillforge-ai.emacsah.com
      app_name: shell
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===== Tests E2E =====
  e2e-tests:
    name: E2E Tests - Staging
    needs: [detect-changes, deploy-frontend, smoke-tests-frontend]
    if: always() && needs.smoke-tests-frontend.result == 'success'
    uses: ./.github/workflows/e2e-tests-staging.yml
    with:
      base_url: https://skillforge-ai.emacsah.com
      api_url: https://skillforge-user-service-staging-721427084268.europe-west1.run.app
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ===== Résumé du Déploiement =====
  deployment-summary:
    name: Deployment Summary & Notification
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-backend, deploy-frontend, smoke-tests-backend, smoke-tests-frontend, e2e-tests]
    if: always() && needs.detect-changes.outputs.deployment_needed == 'true'

    steps:
      - name: Generate deployment summary
        run: |
          echo "# 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: develop" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ needs.detect-changes.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Message**: ${{ needs.detect-changes.outputs.commit_message }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Services | ${{ needs.deploy-backend.result == 'success' && '✅ Deployed' || needs.deploy-backend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Apps | ${{ needs.deploy-frontend.result == 'success' && '✅ Deployed' || needs.deploy-frontend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Smoke Tests | ${{ needs.smoke-tests-backend.result == 'success' && '✅ Passed' || needs.smoke-tests-backend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Smoke Tests | ${{ needs.smoke-tests-frontend.result == 'success' && '✅ Passed' || needs.smoke-tests-frontend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || needs.e2e-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Service URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Shell**: https://skillforge-ai.emacsah.com" >> $GITHUB_STEP_SUMMARY
          echo "- **User Service API**: https://skillforge-user-service-staging-721427084268.europe-west1.run.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Company Service API**: https://skillforge-company-service-staging-721427084268.europe-west1.run.app" >> $GITHUB_STEP_SUMMARY

      - name: Check deployment status
        run: |
          BACKEND_STATUS="${{ needs.deploy-backend.result }}"
          FRONTEND_STATUS="${{ needs.deploy-frontend.result }}"
          BACKEND_TESTS="${{ needs.smoke-tests-backend.result }}"
          FRONTEND_TESTS="${{ needs.smoke-tests-frontend.result }}"
          E2E_TESTS="${{ needs.e2e-tests.result }}"

          # Check for any failures (excluding skipped)
          if [[ "$BACKEND_STATUS" == "failure" ]] || \
             [[ "$FRONTEND_STATUS" == "failure" ]] || \
             [[ "$BACKEND_TESTS" == "failure" ]] || \
             [[ "$FRONTEND_TESTS" == "failure" ]] || \
             [[ "$E2E_TESTS" == "failure" ]]; then
            echo "❌ Deployment or tests failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Action Required**: Review failed jobs and fix issues before merging to production" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All deployments and tests successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Ready for production deployment when merging to main branch." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on Slack (Failure)
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"❌ Staging deployment failed\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"❌ Staging Deployment Failed\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Branch:*\\ndevelop\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Environment:*\\nStaging\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Commit:*\\n${{ needs.detect-changes.outputs.commit_sha }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Author:*\\n${{ github.actor }}\"}
                  ]
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Message:* ${{ needs.detect-changes.outputs.commit_message }}\"
                  }
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {\"type\": \"plain_text\", \"text\": \"View Workflow\"},
                      \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                    }
                  ]
                }
              ]
            }"

      - name: Notify on Slack (Success)
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"✅ Staging deployment successful\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"✅ Staging Deployment Successful\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Branch:*\\ndevelop\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Environment:*\\nStaging\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Commit:*\\n${{ needs.detect-changes.outputs.commit_sha }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Author:*\\n${{ github.actor }}\"}
                  ]
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Message:* ${{ needs.detect-changes.outputs.commit_message }}\\n\\n🌐 *Frontend:* https://skillforge-ai.emacsah.com\"
                  }
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {\"type\": \"plain_text\", \"text\": \"View Workflow\"},
                      \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                    }
                  ]
                }
              ]
            }"
