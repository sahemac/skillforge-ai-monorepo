# ============================================================================
# TEMPLATE: Backend FastAPI Service Deployment
# ============================================================================
#
# This template deploys a Python FastAPI backend service to Google Cloud Run.
#
# 📝 HOW TO USE:
# 1. Copy this file to .github/workflows/deploy-{{SERVICE_NAME}}.yml
# 2. Replace ALL {{PLACEHOLDERS}} with actual values:
#    - {{SERVICE_NAME}}: e.g., notification-service, analytics-service
#    - {{SERVICE_PATH}}: e.g., apps/backend/notification-service
#    - {{SERVICE_PORT}}: e.g., 8003, 8004
#    - {{SERVICE_DESCRIPTION}}: e.g., "Send email and push notifications"
# 3. Adjust configuration flags: has_migration, has_tests, etc.
# 4. Create service account in GCP (see templates/README.md)
# 5. Test and commit!
#
# ============================================================================

name: Deploy - {{SERVICE_DESCRIPTION}}

on:
  push:
    branches: [main, develop]
    paths:
      - '{{SERVICE_PATH}}/**'
      - '.github/workflows/deploy-{{SERVICE_NAME}}.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '{{SERVICE_PATH}}/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests'
        required: false
        type: boolean
        default: false
      skip_migration:
        description: 'Skip database migration'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  deploy:
    name: Deploy {{SERVICE_NAME}}
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: '{{SERVICE_NAME}}'
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests || false }}
      skip_migration: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migration || false }}
    secrets: inherit

# ============================================================================
# CONFIGURATION REFERENCE
# ============================================================================
#
# The reusable workflow (deploy-service.yml) will automatically detect:
# - Service type: backend (Python FastAPI)
# - Service path: {{SERVICE_PATH}}
# - Language: Python
# - Framework: FastAPI
# - Database: PostgreSQL (if has_migration=true)
# - Testing: pytest (if has_tests=true)
#
# Service Configuration in deploy-service.yml (lines 158-259):
# Add a new case block if this is a NEW service:
#
#   "{{SERVICE_NAME}}")
#     SERVICE_CONFIG='{
#       "type":"backend",
#       "language":"python",
#       "framework":"fastapi",
#       "has_migration":true,     # Set to false if no database
#       "has_tests":true          # Set to false if no tests yet
#     }'
#     echo "service_name=${{ inputs.environment }}-{{SERVICE_NAME}}" >> $GITHUB_OUTPUT
#     echo "service_path={{SERVICE_PATH}}" >> $GITHUB_OUTPUT
#     echo "cloud_run_service=${{ inputs.environment }}-{{SERVICE_NAME}}" >> $GITHUB_OUTPUT
#     echo "dockerfile=Dockerfile" >> $GITHUB_OUTPUT
#     echo "port={{SERVICE_PORT}}" >> $GITHUB_OUTPUT
#     echo "health_check_path=/health" >> $GITHUB_OUTPUT
#     ;;
#
