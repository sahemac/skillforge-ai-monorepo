# REQUIRED SETUP (Before first deployment)
# ============================================================================
#
# 1. Service Account:
#    gcloud iam service-accounts create sa-{{SERVICE_NAME}}-staging \
#      --project=skillforge-ai-mvp-25
#
# 2. IAM Permissions:
#    for role in roles/cloudsql.client roles/logging.logWriter roles/monitoring.metricWriter; do
#      gcloud projects add-iam-policy-binding skillforge-ai-mvp-25 \
#        --member="serviceAccount:sa-{{SERVICE_NAME}}-staging@skillforge-ai-mvp-25.iam.gserviceaccount.com" \
#        --role="$role"
#    done
#
# 3. Secret Access:
#    for secret in DATABASE_URL SECRET_KEY SMTP_PASSWORD; do
#      gcloud secrets add-iam-policy-binding $secret \
#        --member="serviceAccount:sa-{{SERVICE_NAME}}-staging@skillforge-ai-mvp-25.iam.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"
#    done
#
# 4. Service-Specific Secrets (if needed):
#    # Example: SENDGRID_API_KEY, STRIPE_SECRET_KEY, etc.
#    gcloud secrets create {{SERVICE_NAME}}_API_KEY --data-file=key.txt
#
# ============================================================================
# DEPLOYMENT CHECKLIST
# ============================================================================
#
# Before merging this workflow:
# [ ] All {{PLACEHOLDERS}} replaced
# [ ] Service name matches directory: {{SERVICE_PATH}}
# [ ] Service account created: sa-{{SERVICE_NAME}}-staging
# [ ] IAM permissions granted (cloudsql, logging, monitoring)
# [ ] Secret access configured (DATABASE_URL, SECRET_KEY, etc.)
# [ ] Dockerfile exists: {{SERVICE_PATH}}/Dockerfile
# [ ] requirements.txt exists: {{SERVICE_PATH}}/requirements.txt
# [ ] Configuration added to deploy-service.yml (if new service)
# [ ] Health check endpoint implemented: /health
# [ ] Tests pass locally: cd {{SERVICE_PATH}} && pytest
# [ ] Migration files created (if has_migration=true): alembic/versions/
# [ ] Environment variables documented in .env.example
#
# ============================================================================
# TESTING LOCALLY
# ============================================================================
#
# Test the service before deploying:
#
#   cd {{SERVICE_PATH}}
#   python -m venv venv
#   source venv/bin/activate  # or venv\Scripts\activate on Windows
#   pip install -r requirements.txt
#   uvicorn app.main:app --host 0.0.0.0 --port {{SERVICE_PORT}} --reload
#
# Run tests:
#   pytest -v
#
# Check database migrations:
#   alembic current
#   alembic upgrade head
#
# ============================================================================
