name: Canary Deployment - Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (frontend or backend service name)'
        required: true
        type: choice
        options:
          - shell
          - user-service
          - company-service
      skip_approval:
        description: 'Skip manual approval gates'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  GCP_PROJECT_ID: skillforge-ai-mvp-25
  GCP_REGION: europe-west1
  ENVIRONMENT: production

jobs:
  # ===== Phase 1: Préparation =====
  prepare-canary:
    name: Prepare Canary Deployment
    runs-on: ubuntu-latest
    outputs:
      service_name: ${{ steps.setup.outputs.service_name }}
      service_type: ${{ steps.setup.outputs.service_type }}
      current_revision: ${{ steps.current.outputs.revision }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Determine service configuration
        id: setup
        run: |
          SERVICE="${{ inputs.service }}"

          if [[ "$SERVICE" == "shell" ]]; then
            SERVICE_NAME="skillforge-frontend-shell-production"
            SERVICE_TYPE="frontend"
          elif [[ "$SERVICE" == "user-service" ]]; then
            SERVICE_NAME="skillforge-user-service-production"
            SERVICE_TYPE="backend"
          elif [[ "$SERVICE" == "company-service" ]]; then
            SERVICE_NAME="skillforge-company-service-production"
            SERVICE_TYPE="backend"
          else
            echo "❌ Unknown service: $SERVICE"
            exit 1
          fi

          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "service_type=$SERVICE_TYPE" >> $GITHUB_OUTPUT

          echo "✅ Service: $SERVICE_NAME (type: $SERVICE_TYPE)"

      - name: Get current production revision
        id: current
        run: |
          CURRENT_REVISION=$(gcloud run services describe ${{ steps.setup.outputs.service_name }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.latestReadyRevisionName)')

          echo "revision=$CURRENT_REVISION" >> $GITHUB_OUTPUT
          echo "📌 Current production revision: $CURRENT_REVISION"

      - name: Display canary plan
        run: |
          echo "## 🐤 Canary Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service**: ${{ steps.setup.outputs.service_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type**: ${{ steps.setup.outputs.service_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Current Revision**: ${{ steps.current.outputs.revision }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Canary Strategy" >> $GITHUB_STEP_SUMMARY
          echo "1. Deploy new revision" >> $GITHUB_STEP_SUMMARY
          echo "2. Route 10% traffic → Monitor 5 min" >> $GITHUB_STEP_SUMMARY
          echo "3. Route 50% traffic → Monitor 5 min" >> $GITHUB_STEP_SUMMARY
          echo "4. Route 100% traffic → Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Auto-rollback on errors" >> $GITHUB_STEP_SUMMARY

  # ===== Phase 2: Déploiement nouvelle révision =====
  deploy-new-revision:
    name: Deploy New Revision (0% traffic)
    needs: prepare-canary
    runs-on: ubuntu-latest
    outputs:
      new_revision: ${{ steps.deploy.outputs.revision }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy new revision with 0% traffic
        id: deploy
        run: |
          echo "🚀 Deploying new revision with 0% traffic..."

          SERVICE_NAME="${{ needs.prepare-canary.outputs.service_name }}"
          SERVICE_TYPE="${{ needs.prepare-canary.outputs.service_type }}"

          # Determine service account based on service type
          if [[ "$SERVICE_TYPE" == "frontend" ]]; then
            SERVICE_ACCOUNT="sa-${{ inputs.service }}-frontend-production@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          else
            SERVICE_ACCOUNT="sa-${{ inputs.service }}-production@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          fi

          echo "📋 Service Account: $SERVICE_ACCOUNT"

          # Deploy with no-traffic flag
          gcloud run deploy $SERVICE_NAME \
            --region=${{ env.GCP_REGION }} \
            --service-account=$SERVICE_ACCOUNT \
            --no-traffic \
            --tag=canary

          # Get the new revision name
          NEW_REVISION=$(gcloud run services describe $SERVICE_NAME \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.latestCreatedRevisionName)')

          echo "revision=$NEW_REVISION" >> $GITHUB_OUTPUT
          echo "✅ New canary revision deployed: $NEW_REVISION"
          echo "🔗 Canary URL: https://canary---${SERVICE_NAME}-${GCP_PROJECT_ID}.${GCP_REGION}.run.app"

  # ===== Phase 3: Canary 10% =====
  canary-10-percent:
    name: Canary - 10% Traffic
    needs: [prepare-canary, deploy-new-revision]
    runs-on: ubuntu-latest
    environment:
      name: production-canary-10
      url: https://skillforge-ai.emacsah.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Route 10% traffic to canary
        run: |
          echo "🔀 Routing 10% traffic to canary..."

          gcloud run services update-traffic ${{ needs.prepare-canary.outputs.service_name }} \
            --region=${{ env.GCP_REGION }} \
            --to-revisions=${{ needs.deploy-new-revision.outputs.new_revision }}=10,${{ needs.prepare-canary.outputs.current_revision }}=90

          echo "✅ Traffic split: 10% canary / 90% stable"

      - name: Monitor canary for 5 minutes
        run: |
          echo "👀 Monitoring canary revision for 5 minutes..."

          MONITORING_DURATION=300  # 5 minutes
          CHECK_INTERVAL=30        # Check every 30 seconds
          ELAPSED=0

          while [ $ELAPSED -lt $MONITORING_DURATION ]; do
            # Check for errors in logs
            ERROR_COUNT=$(gcloud logging read \
              "resource.type=cloud_run_revision \
               AND resource.labels.service_name=${{ needs.prepare-canary.outputs.service_name }} \
               AND resource.labels.revision_name=${{ needs.deploy-new-revision.outputs.new_revision }} \
               AND severity>=ERROR \
               AND timestamp>=\"$(date -u -d '1 minute ago' --iso-8601=seconds)\"" \
              --limit=50 \
              --format="value(jsonPayload.message)" \
              2>/dev/null | wc -l)

            echo "⏱️  Elapsed: ${ELAPSED}s / ${MONITORING_DURATION}s - Errors in last minute: $ERROR_COUNT"

            if [ "$ERROR_COUNT" -gt 10 ]; then
              echo "❌ High error rate detected! Initiating rollback..."
              exit 1
            fi

            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done

          echo "✅ Canary 10% monitoring complete - No issues detected"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "🔄 Rolling back to stable revision..."

          gcloud run services update-traffic ${{ needs.prepare-canary.outputs.service_name }} \
            --region=${{ env.GCP_REGION }} \
            --to-revisions=${{ needs.prepare-canary.outputs.current_revision }}=100

          echo "✅ Rolled back to stable revision"

  # ===== Phase 4: Canary 50% =====
  canary-50-percent:
    name: Canary - 50% Traffic
    needs: [prepare-canary, deploy-new-revision, canary-10-percent]
    runs-on: ubuntu-latest
    environment:
      name: production-canary-50
      url: https://skillforge-ai.emacsah.com

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Route 50% traffic to canary
        run: |
          echo "🔀 Routing 50% traffic to canary..."

          gcloud run services update-traffic ${{ needs.prepare-canary.outputs.service_name }} \
            --region=${{ env.GCP_REGION }} \
            --to-revisions=${{ needs.deploy-new-revision.outputs.new_revision }}=50,${{ needs.prepare-canary.outputs.current_revision }}=50

          echo "✅ Traffic split: 50% canary / 50% stable"

      - name: Monitor canary for 5 minutes
        run: |
          echo "👀 Monitoring canary revision for 5 minutes..."

          MONITORING_DURATION=300
          CHECK_INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $MONITORING_DURATION ]; do
            ERROR_COUNT=$(gcloud logging read \
              "resource.type=cloud_run_revision \
               AND resource.labels.service_name=${{ needs.prepare-canary.outputs.service_name }} \
               AND resource.labels.revision_name=${{ needs.deploy-new-revision.outputs.new_revision }} \
               AND severity>=ERROR \
               AND timestamp>=\"$(date -u -d '1 minute ago' --iso-8601=seconds)\"" \
              --limit=50 \
              --format="value(jsonPayload.message)" \
              2>/dev/null | wc -l)

            echo "⏱️  Elapsed: ${ELAPSED}s / ${MONITORING_DURATION}s - Errors in last minute: $ERROR_COUNT"

            if [ "$ERROR_COUNT" -gt 10 ]; then
              echo "❌ High error rate detected! Initiating rollback..."
              exit 1
            fi

            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done

          echo "✅ Canary 50% monitoring complete - No issues detected"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "🔄 Rolling back to stable revision..."

          gcloud run services update-traffic ${{ needs.prepare-canary.outputs.service_name }} \
            --region=${{ env.GCP_REGION }} \
            --to-revisions=${{ needs.prepare-canary.outputs.current_revision }}=100

          echo "✅ Rolled back to stable revision"

  # ===== Phase 5: Canary 100% =====
  canary-100-percent:
    name: Canary - 100% Traffic (Complete)
    needs: [prepare-canary, deploy-new-revision, canary-50-percent]
    runs-on: ubuntu-latest
    environment:
      name: production-canary-complete
      url: https://skillforge-ai.emacsah.com

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Route 100% traffic to canary
        run: |
          echo "🔀 Routing 100% traffic to new revision..."

          gcloud run services update-traffic ${{ needs.prepare-canary.outputs.service_name }} \
            --region=${{ env.GCP_REGION }} \
            --to-revisions=${{ needs.deploy-new-revision.outputs.new_revision }}=100

          echo "✅ Canary deployment complete! 100% traffic on new revision"

      - name: Final health check
        run: |
          echo "🏥 Running final health check..."

          # Get service URL
          SERVICE_URL=$(gcloud run services describe ${{ needs.prepare-canary.outputs.service_name }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')

          # Health check
          HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/health" || echo "000")

          if [ "$HEALTH_RESPONSE" = "200" ]; then
            echo "✅ Final health check passed"
          else
            echo "⚠️ Health check returned HTTP $HEALTH_RESPONSE"
            exit 1
          fi

  # ===== Résumé =====
  deployment-summary:
    name: Canary Deployment Summary
    runs-on: ubuntu-latest
    needs: [prepare-canary, deploy-new-revision, canary-10-percent, canary-50-percent, canary-100-percent]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# 🐤 Canary Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service**: ${{ needs.prepare-canary.outputs.service_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Previous Revision**: ${{ needs.prepare-canary.outputs.current_revision }}" >> $GITHUB_STEP_SUMMARY
          echo "**New Revision**: ${{ needs.deploy-new-revision.outputs.new_revision }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Stages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| New Revision Deploy | ${{ needs.deploy-new-revision.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary 10% | ${{ needs.canary-10-percent.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary 50% | ${{ needs.canary-50-percent.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary 100% | ${{ needs.canary-100-percent.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.canary-100-percent.result }}" == "success" ]]; then
            echo "✅ **Canary deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Canary deployment failed or was rolled back**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Slack
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          if [[ "${{ needs.canary-100-percent.result }}" == "success" ]]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="Canary deployment successful"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="Canary deployment failed"
          fi

          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"${STATUS_EMOJI} ${STATUS_TEXT}\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"${STATUS_EMOJI} Canary Deployment\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Service:*\\n${{ needs.prepare-canary.outputs.service_name }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Environment:*\\nProduction\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Previous:*\\n${{ needs.prepare-canary.outputs.current_revision }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*New:*\\n${{ needs.deploy-new-revision.outputs.new_revision }}\"}
                  ]
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {\"type\": \"plain_text\", \"text\": \"View Workflow\"},
                      \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                    }
                  ]
                }
              ]
            }"
