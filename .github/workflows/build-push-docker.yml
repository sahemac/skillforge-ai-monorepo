# .github/workflows/build-push-docker.yml
name: "Reusable - Build, Scan, and Push Docker Image"
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_WIF_PROVIDER:
        required: true
      GCP_CICD_SERVICE_ACCOUNT:
        required: true
    outputs:
      image_uri:
        description: "The full URI of the pushed image"
        value: ${{ jobs.build-scan-push.outputs.image_uri }}
jobs:
  build-scan-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
      security-events: 'write'  # For SARIF upload to Security tab
    env:
      IMAGE_URI: "europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.image_name }}/${{ inputs.image_tag }}:${{ github.sha }}"
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac'
      
      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - name: Build Docker Image
        id: build
        run: |
          # Build with security best practices
          docker build \
            --no-cache \
            --pull \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ github.sha }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t ${IMAGE_URI} \
            -f ${{ inputs.dockerfile_path }} .
          
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@0.20.0
        continue-on-error: true  # Don't block deployment for security scan failures
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'  # Don't fail the job on vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true  # Don't block if upload fails
        with:
          sarif_file: 'trivy-results.sarif'
          
      - name: Scan Docker Image - Table Output
        uses: aquasecurity/trivy-action@0.20.0
        if: always()
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
      - name: Push Docker Image
        id: push
        run: |
          docker push ${{ env.IMAGE_URI }}
          echo "image_uri=${{ env.IMAGE_URI }}" >> $GITHUB_OUTPUT