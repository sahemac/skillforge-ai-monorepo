name: Smoke Tests - Post Deployment Validation

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        type: string
      service_url:
        description: 'Service URL to test'
        required: true
        type: string
      app_name:
        description: 'Application name'
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      service_url:
        description: 'Service URL to test'
        required: true
        type: string
      app_name:
        description: 'Application name'
        required: true
        type: string

jobs:
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Health Check Test
        id: health_check
        run: |
          echo "🏥 Testing health endpoint..."
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.service_url }}/health" || echo "000")

            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Health check passed (HTTP $RESPONSE)"
              SUCCESS=true
              break
            else
              echo "⚠️ Health check failed (HTTP $RESPONSE), retry $((RETRY_COUNT + 1))/$MAX_RETRIES"
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 10
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Health check failed after $MAX_RETRIES retries"
            exit 1
          fi

      - name: Homepage Load Test
        id: homepage_test
        run: |
          echo "🌐 Testing homepage..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.service_url }}/")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Homepage loads successfully (HTTP $RESPONSE)"
          else
            echo "❌ Homepage failed to load (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Static Assets Test
        id: assets_test
        run: |
          echo "📦 Testing static assets..."

          # Test CSS file
          CSS_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.service_url }}/assets/index.css" || echo "000")

          # Test JS bundle
          JS_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.service_url }}/assets/index.js" || echo "000")

          # Test logo
          LOGO_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.service_url }}/logos/logo_skillforge_AI.png" || echo "000")

          echo "CSS Response: $CSS_RESPONSE"
          echo "JS Response: $JS_RESPONSE"
          echo "Logo Response: $LOGO_RESPONSE"

          if [ "$CSS_RESPONSE" = "200" ] && [ "$LOGO_RESPONSE" = "200" ]; then
            echo "✅ Critical static assets load successfully"
          else
            echo "⚠️ Some static assets may not be loading correctly"
          fi

      - name: Performance Test
        id: performance_test
        run: |
          echo "⚡ Testing response time..."
          RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}' "${{ inputs.service_url }}/")

          echo "Response time: ${RESPONSE_TIME}s"

          # Convert to milliseconds for comparison
          RESPONSE_MS=$(echo "$RESPONSE_TIME * 1000" | bc)

          if (( $(echo "$RESPONSE_TIME < 3.0" | bc -l) )); then
            echo "✅ Response time excellent: ${RESPONSE_TIME}s"
          elif (( $(echo "$RESPONSE_TIME < 5.0" | bc -l) )); then
            echo "⚠️ Response time acceptable but could be improved: ${RESPONSE_TIME}s"
          else
            echo "❌ Response time too slow: ${RESPONSE_TIME}s"
            exit 1
          fi

      - name: Security Headers Test
        id: security_test
        run: |
          echo "🔒 Testing security headers..."
          HEADERS=$(curl -s -I "${{ inputs.service_url }}/")

          if echo "$HEADERS" | grep -qi "X-Frame-Options"; then
            echo "✅ X-Frame-Options header present"
          else
            echo "⚠️ X-Frame-Options header missing"
          fi

          if echo "$HEADERS" | grep -qi "X-Content-Type-Options"; then
            echo "✅ X-Content-Type-Options header present"
          else
            echo "⚠️ X-Content-Type-Options header missing"
          fi

      - name: Navigation Links Test
        id: navigation_test
        run: |
          echo "🔗 Testing navigation routes..."

          ROUTES=("/" "/register" "/login" "/mission" "/contact")
          ALL_PASSED=true

          for route in "${ROUTES[@]}"; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.service_url }}${route}")

            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Route ${route}: HTTP $RESPONSE"
            else
              echo "⚠️ Route ${route}: HTTP $RESPONSE"
              ALL_PASSED=false
            fi
          done

          if [ "$ALL_PASSED" = true ]; then
            echo "✅ All navigation routes accessible"
          else
            echo "⚠️ Some navigation routes may have issues"
          fi

      - name: Generate Test Report
        if: always()
        run: |
          echo "# 🧪 Smoke Tests Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application**: ${{ inputs.app_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL**: ${{ inputs.service_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ steps.health_check.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Homepage Load | ${{ steps.homepage_test.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Assets | ${{ steps.assets_test.outcome == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ steps.performance_test.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Headers | ${{ steps.security_test.outcome == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Navigation | ${{ steps.navigation_test.outcome == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack on Failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"❌ Smoke tests failed for ${{ inputs.app_name }} in ${{ inputs.environment }}\\nService URL: ${{ inputs.service_url }}\\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
