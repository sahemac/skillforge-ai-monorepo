# .github/workflows/validate-iap.yml
name: "Validate IAP Configuration"

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to validate (staging/production)'
        required: false
        type: string
        default: 'staging'
      service_url:
        description: 'Service URL to test IAP access'
        required: true
        type: string
    secrets:
      IAP_TEST_SERVICE_ACCOUNT_KEY:
        description: 'Service account key for IAP testing'
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  validate-iap:
    name: Validate IAP Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth google-auth-oauthlib google-auth-httplib2
          
      - name: Test IAP protected endpoint access
        env:
          SERVICE_URL: ${{ inputs.service_url }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "🔍 Testing IAP configuration for $ENVIRONMENT environment..."
          
          # Test 1: Verify that unauthenticated requests are blocked
          echo "Test 1: Verifying unauthenticated access is blocked..."
          
          response_code=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health" || echo "000")
          
          if [[ "$response_code" == "302" ]] || [[ "$response_code" == "401" ]] || [[ "$response_code" == "403" ]]; then
            echo "✅ Unauthenticated access correctly blocked (HTTP $response_code)"
          elif [[ "$response_code" == "000" ]]; then
            echo "ℹ️  Service unreachable - may not be deployed yet"
          else
            echo "⚠️  WARNING: Unexpected response code: $response_code"
            echo "Expected: 302 (redirect to auth), 401, or 403"
          fi
          
          # Test 2: Check for IAP headers in response
          echo "Test 2: Checking for IAP-specific headers..."
          
          headers=$(curl -s -I "$SERVICE_URL/health" 2>/dev/null || echo "")
          
          if echo "$headers" | grep -qi "google"; then
            echo "✅ Google/IAP headers detected"
          else
            echo "ℹ️  No Google/IAP headers found (expected if service not deployed)"
          fi
          
          # Test 3: Validate redirect to Google OAuth
          echo "Test 3: Testing OAuth redirect..."
          
          redirect_location=$(curl -s -I "$SERVICE_URL/health" | grep -i "location:" | head -1 || echo "")
          
          if echo "$redirect_location" | grep -qi "accounts.google.com\|oauth"; then
            echo "✅ Redirects to Google OAuth (IAP is active)"
          else
            echo "ℹ️  No OAuth redirect detected"
          fi
          
      - name: Generate IAP test script
        run: |
          cat > test_iap_python.py << 'EOF'
          #!/usr/bin/env python3
          """
          IAP Configuration Test Script
          Tests Identity-Aware Proxy configuration
          """
          import requests
          import sys
          import os
          
          def test_iap_protection(url):
              """Test that IAP is protecting the endpoint"""
              print(f"Testing IAP protection for: {url}")
              
              try:
                  # Test without authentication
                  response = requests.get(f"{url}/health", timeout=10, allow_redirects=False)
                  
                  print(f"Status Code: {response.status_code}")
                  print(f"Headers: {dict(response.headers)}")
                  
                  # Check if response indicates IAP protection
                  if response.status_code in [302, 401, 403]:
                      print("✅ IAP protection is active")
                      
                      if response.status_code == 302:
                          location = response.headers.get('Location', '')
                          if 'accounts.google.com' in location:
                              print("✅ Redirects to Google OAuth")
                          else:
                              print(f"⚠️  Redirects to: {location}")
                      
                      return True
                  else:
                      print(f"⚠️  Unexpected status: {response.status_code}")
                      return False
                      
              except requests.exceptions.RequestException as e:
                  print(f"ℹ️  Request failed: {e}")
                  print("This may indicate the service is not yet deployed")
                  return None
          
          if __name__ == "__main__":
              service_url = os.environ.get('SERVICE_URL', '')
              if not service_url:
                  print("❌ SERVICE_URL environment variable not set")
                  sys.exit(1)
              
              result = test_iap_protection(service_url)
              if result is True:
                  print("✅ IAP validation passed")
                  sys.exit(0)
              elif result is False:
                  print("❌ IAP validation failed")
                  sys.exit(1)
              else:
                  print("ℹ️  IAP validation inconclusive")
                  sys.exit(0)
          EOF
          
      - name: Run Python IAP test
        env:
          SERVICE_URL: ${{ inputs.service_url }}
        run: |
          python test_iap_python.py
          
      - name: IAP Validation Summary
        if: always()
        run: |
          echo "## 🔒 IAP Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL**: ${{ inputs.service_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tests Performed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unauthenticated access blocking" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ IAP header detection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ OAuth redirect validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Python-based endpoint testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: If service shows as unreachable, ensure it's deployed first." >> $GITHUB_STEP_SUMMARY