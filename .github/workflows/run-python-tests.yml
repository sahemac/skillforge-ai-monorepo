# .github/workflows/run-python-tests.yml

name: "Reusable - Run Python Tests"

on:
  workflow_call:
    inputs:
      python-version:
        description: "The version of Python to use"
        required: false
        type: string
        default: "3.11"
      service-directory:
        description: "The directory of the service to test"
        required: true
        type: string
    secrets:
      DATABASE_URL_STAGING:
        description: "Staging database URL for integration tests"
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    # Tests will use real staging PostgreSQL database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            .venv
          key: ${{ runner.os }}-pip-${{ hashFiles(format('{0}/requirements*.txt', inputs.service-directory)) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Install dependencies from requirements.txt if exists, otherwise install core ones
          if [[ -f "${{ inputs.service-directory }}/requirements.txt" ]]; then
            echo "Installing from requirements.txt..."
            pip install -r ${{ inputs.service-directory }}/requirements.txt
          else
            echo "Installing core dependencies..."
            pip install fastapi==0.104.1 pytest==7.4.3 pytest-asyncio==0.21.1 sqlmodel==0.0.14 httpx==0.25.2 aiosqlite==0.19.0 pydantic-settings==2.1.0 python-jose==3.3.0 passlib==1.7.4 asyncpg==0.29.0 email-validator==2.1.0 pytest-cov==4.1.0
          fi

          # Install additional test dependencies
          pip install pytest-postgresql pytest-xdist

      - name: Setup Cloud SQL Proxy
        run: |
          # Install Cloud SQL Proxy
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.6.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          # No need to start proxy as we'll use direct connection

      - name: Run tests with pytest
        env:
          # Use real staging database for tests
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          
          # Test environment settings
          ENVIRONMENT: "testing"
          SECRET_KEY: "test-secret-key-for-ci-cd-only"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          
          # Disable some external services for tests
          REDIS_HOST: ""
          ENABLE_METRICS: "false"
          
          # Enable email service for real email testing
          SMTP_HOST: "mail.emacsah.com"
          SMTP_PORT: "587"
          SMTP_USER: "sah@emacsah.com"
          SMTP_PASSWORD: "Psaumes@27"
          EMAILS_FROM_EMAIL: "sah@emacsah.com"
          
          # Disable rate limiting for tests
          DISABLE_RATE_LIMITING: "true"
          
        run: |
          cd ${{ inputs.service-directory }}
          export PYTHONPATH="${PWD}:${PYTHONPATH}"
          
          echo "Running tests with real staging PostgreSQL..."
          echo "Database configured for staging environment"
          
          # Run tests with coverage
          pytest -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml
          
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false