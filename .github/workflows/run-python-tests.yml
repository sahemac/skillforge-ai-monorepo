name: "Reusable - Run Python Tests"
on:
  workflow_call:
    inputs:
      python-version:
        description: "The version of Python to use"
        required: false
        type: string
        default: "3.11"
      service-directory:
        description: "The directory of the service to test"
        required: true
        type: string
    secrets:
      DATABASE_URL_STAGING:
        description: "Staging database URL for integration tests"
        required: true
      GCP_PROJECT_ID:
        description: "Google Cloud Project ID"
        required: true
      GCP_WIF_PROVIDER:
        description: "GCP Workload Identity Federation Provider"
        required: true
      GCP_CICD_SERVICE_ACCOUNT:
        description: "GCP CI/CD Service Account"
        required: true
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            .venv
          key: ${{ runner.os }}-pip-${{ hashFiles(format('{0}/requirements*.txt', inputs.service-directory)) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Install dependencies from requirements.txt if exists, otherwise install core ones
          if [[ -f "${{ inputs.service-directory }}/requirements.txt" ]]; then
            echo "Installing from requirements.txt..."
            pip install -r ${{ inputs.service-directory }}/requirements.txt
          else
            echo "Installing core dependencies..."
            pip install fastapi==0.104.1 pytest==7.4.3 pytest-asyncio==0.21.1 sqlmodel==0.0.14 httpx==0.25.2 aiosqlite==0.19.0 pydantic-settings==2.1.0 python-jose==3.3.0 passlib==1.7.4 asyncpg==0.29.0 email-validator==2.1.0 pytest-cov==4.1.0
          fi
          # Install additional test dependencies
          pip install pytest-postgresql pytest-xdist

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Install Cloud SQL Proxy
        run: |
          echo "🔧 Installing Cloud SQL Proxy..."
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          sudo mv cloud-sql-proxy /usr/local/bin/
          echo "✅ Cloud SQL Proxy installed:"
          cloud-sql-proxy --version

      - name: Start Cloud SQL Proxy
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "🚀 Starting Cloud SQL Proxy..."
          INSTANCE_CONNECTION_NAME="$PROJECT_ID:europe-west1:skillforge-pg-instance-staging"
          echo "Instance: $INSTANCE_CONNECTION_NAME"

          # Start Cloud SQL Proxy in background on port 5432 (standard PostgreSQL port)
          cloud-sql-proxy \
            --port=5432 \
            "$INSTANCE_CONNECTION_NAME" &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> $GITHUB_ENV

          echo "⏳ Waiting for Cloud SQL Proxy to be ready..."
          sleep 10

          # Test proxy connection
          if timeout 30 bash -c 'until nc -z localhost 5432; do sleep 1; done'; then
            echo "✅ Cloud SQL Proxy is ready on port 5432"
          else
            echo "❌ Cloud SQL Proxy failed to start"
            echo "Checking proxy process..."
            ps aux | grep cloud-sql-proxy || echo "No proxy process found"
            echo "Checking port 5432..."
            netstat -tuln | grep 5432 || echo "Port 5432 not listening"
            exit 1
          fi

      - name: Get Database Password from Secret Manager
        id: get-db-password
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "🔐 Retrieving database password from Secret Manager..."
          if DB_PASSWORD=$(gcloud secrets versions access latest --secret="postgres-password-staging" --project="$PROJECT_ID" 2>&1); then
            if [[ ! "$DB_PASSWORD" =~ ^ERROR ]]; then
              echo "✅ Retrieved password from Secret Manager"
              echo "db_password=$DB_PASSWORD" >> $GITHUB_OUTPUT
            else
              echo "❌ Secret Manager error: $DB_PASSWORD"
              exit 1
            fi
          else
            echo "❌ gcloud command failed"
            exit 1
          fi

      - name: Run tests with pytest
        env:
          # Use Cloud SQL Proxy connection for tests
          DATABASE_URL: "postgresql+asyncpg://skillforge_user:${{ steps.get-db-password.outputs.db_password }}@localhost:5432/skillforge_db"

          # Test environment settings
          ENVIRONMENT: "testing"
          SECRET_KEY: "test-secret-key-for-ci-cd-only"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"

          # Disable some external services for tests
          REDIS_HOST: ""
          ENABLE_METRICS: "false"

          # Enable email service for real email testing
          SMTP_HOST: "mail.emacsah.com"
          SMTP_PORT: "587"
          SMTP_USER: "sah@emacsah.com"
          SMTP_PASSWORD: "Psaumes@27"
          EMAILS_FROM_EMAIL: "sah@emacsah.com"

          # Disable rate limiting for tests
          DISABLE_RATE_LIMITING: "true"

        run: |
          cd ${{ inputs.service-directory }}
          export PYTHONPATH="${PWD}:${PYTHONPATH}"

          echo "Running tests with Cloud SQL Proxy..."
          echo "Database configured for staging environment"

          # Run tests with coverage
          pytest -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml

      - name: Cleanup Cloud SQL Proxy
        if: always() && env.PROXY_PID
        run: |
          echo "🧹 Stopping Cloud SQL Proxy..."
          if [[ -n "$PROXY_PID" ]] && kill -0 "$PROXY_PID" 2>/dev/null; then
            kill "$PROXY_PID"
            echo "✅ Cloud SQL Proxy stopped"
          else
            echo "ℹ️ Cloud SQL Proxy was not running"
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
