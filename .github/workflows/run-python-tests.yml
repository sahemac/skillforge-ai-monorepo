# .github/workflows/run-python-tests.yml

name: "Reusable - Run Python Tests"

on:
  workflow_call:
    inputs:
      python-version:
        description: "The version of Python to use"
        required: false
        type: string
        default: "3.11"
      service-directory:
        description: "The directory of the service to test"
        required: true
        type: string
    secrets:
      TEST_DATABASE_URL:
        description: "Test database URL for integration tests"
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    # PostgreSQL service for integration tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: skillforge_test_db
          POSTGRES_USER: skillforge_test_user
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            .venv
          key: ${{ runner.os }}-pip-${{ hashFiles(format('{0}/requirements*.txt', inputs.service-directory)) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Install dependencies from requirements.txt if exists, otherwise install core ones
          if [[ -f "${{ inputs.service-directory }}/requirements.txt" ]]; then
            echo "Installing from requirements.txt..."
            pip install -r ${{ inputs.service-directory }}/requirements.txt
          else
            echo "Installing core dependencies..."
            pip install fastapi==0.104.1 pytest==7.4.3 pytest-asyncio==0.21.1 sqlmodel==0.0.14 httpx==0.25.2 aiosqlite==0.19.0 pydantic-settings==2.1.0 python-jose==3.3.0 passlib==1.7.4 asyncpg==0.29.0 email-validator==2.1.0 pytest-cov==4.1.0
          fi

          # Install additional test dependencies
          pip install pytest-postgresql pytest-xdist

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U skillforge_test_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Setup test database
        run: |
          # Create test database schema if needed
          PGPASSWORD=test_password_123 psql -h localhost -U skillforge_test_user -d skillforge_test_db -c "SELECT 1;" || true

      - name: Run tests with pytest
        env:
          # Test database configuration
          TEST_DATABASE_URL: "postgresql+asyncpg://skillforge_test_user:test_password_123@localhost:5432/skillforge_test_db"
          DATABASE_URL: "postgresql+asyncpg://skillforge_test_user:test_password_123@localhost:5432/skillforge_test_db"
          
          # Test environment settings
          ENVIRONMENT: "testing"
          SECRET_KEY: "test-secret-key-for-ci-cd-only"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          
          # Disable external services for tests
          REDIS_HOST: ""
          SMTP_HOST: ""
          ENABLE_METRICS: "false"
          
        run: |
          cd ${{ inputs.service-directory }}
          export PYTHONPATH="${PWD}:${PYTHONPATH}"
          
          echo "Running tests with PostgreSQL..."
          echo "Database URL: $TEST_DATABASE_URL"
          
          # Run tests with coverage
          pytest -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml
          
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false