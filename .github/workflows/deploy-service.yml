name: "Unified Service Deployment Pipeline"

on:
  workflow_call:
    inputs:
      service:
        description: 'Service to deploy (user-service, project-service, shell, etc.)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: false
        type: string
        default: 'staging'
      build_type:
        description: 'Build type (backend, frontend, fullstack)'
        required: false
        type: string
        default: 'backend'
      skip_migration:
        description: 'Skip database migration'
        required: false
        type: boolean
        default: false
      skip_tests:
        description: 'Skip test execution'
        required: false
        type: boolean
        default: false
      force_deploy:
        description: 'Force deployment even without changes'
        required: false
        type: boolean
        default: false
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_WIF_PROVIDER:
        required: true
      GCP_CICD_SERVICE_ACCOUNT:
        required: true
      DATABASE_URL_STAGING:
        required: false
      DATABASE_URL_PRODUCTION:
        required: false
      JWT_SECRET_KEY:
        required: false
      API_SECRET_KEY:
        required: false
    outputs:
      service_url:
        description: "The deployed service URL"
        value: ${{ jobs.deploy.outputs.service_url }}
      image_uri:
        description: "The deployed image URI"
        value: ${{ jobs.build.outputs.image_uri }}
      deployment_status:
        description: "Overall deployment status"
        value: ${{ jobs.notify.outputs.status }}

  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - user-service
          - project-service
          - company-service
          - shell
          - admin
          - learner
          - auth
      environment:
        description: 'Target environment'
        required: false
        type: choice
        options:
          - staging
          - production
        default: staging
      build_type:
        description: 'Build type'
        required: false
        type: choice
        options:
          - backend
          - frontend
          - fullstack
        default: backend
      skip_migration:
        description: 'Skip database migration'
        required: false
        type: boolean
        default: false
      skip_tests:
        description: 'Skip test execution'
        required: false
        type: boolean
        default: false
      force_deploy:
        description: 'Force deployment even without changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

env:
  # GCP Configuration
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY: skillforge-ai-registry

  # Common Configuration
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'
  PYTHON_VERSION: '3.11'

jobs:
  # Configuration setup job
  config:
    name: Setup Configuration
    runs-on: ubuntu-latest
    outputs:
      service_config: ${{ steps.setup.outputs.service_config }}
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
      service_name: ${{ steps.setup.outputs.service_name }}
      service_path: ${{ steps.setup.outputs.service_path }}
      dockerfile_path: ${{ steps.setup.outputs.dockerfile_path }}
      image_name: ${{ steps.setup.outputs.image_name }}
      needs_migration: ${{ steps.setup.outputs.needs_migration }}
      needs_tests: ${{ steps.setup.outputs.needs_tests }}
      build_command: ${{ steps.setup.outputs.build_command }}
      test_command: ${{ steps.setup.outputs.test_command }}
      health_endpoint: ${{ steps.setup.outputs.health_endpoint }}
      port: ${{ steps.setup.outputs.port }}
      cloud_run_config: ${{ steps.setup.outputs.cloud_run_config }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup service configuration
        id: setup
        run: |
          # Define service configurations
          case "${{ inputs.service }}" in
            "user-service")
              SERVICE_CONFIG='{"type":"backend","language":"python","framework":"fastapi","has_migration":true,"has_tests":true}'
              echo "service_config=$SERVICE_CONFIG" >> $GITHUB_OUTPUT
              echo "service_name=${{ inputs.environment }}-user-service" >> $GITHUB_OUTPUT
              echo "service_path=apps/backend/user-service" >> $GITHUB_OUTPUT
              echo "dockerfile_path=apps/backend/user-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "image_name=user-service" >> $GITHUB_OUTPUT
              echo "needs_migration=true" >> $GITHUB_OUTPUT
              echo "needs_tests=true" >> $GITHUB_OUTPUT
              echo "build_command=" >> $GITHUB_OUTPUT
              echo "test_command=pytest" >> $GITHUB_OUTPUT
              echo "health_endpoint=/health" >> $GITHUB_OUTPUT
              echo "port=8080" >> $GITHUB_OUTPUT
              CLOUD_RUN_CONFIG='{"memory":"1Gi","cpu":"2","max_instances":"10","min_instances":"1","concurrency":"1000","timeout":"300"}'
              echo "cloud_run_config=$CLOUD_RUN_CONFIG" >> $GITHUB_OUTPUT
              ;;
            "project-service")
              SERVICE_CONFIG='{"type":"backend","language":"python","framework":"fastapi","has_migration":true,"has_tests":true}'
              echo "service_config=$SERVICE_CONFIG" >> $GITHUB_OUTPUT
              echo "service_name=${{ inputs.environment }}-project-service" >> $GITHUB_OUTPUT
              echo "service_path=apps/backend/project-service" >> $GITHUB_OUTPUT
              echo "dockerfile_path=apps/backend/project-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "image_name=project-service" >> $GITHUB_OUTPUT
              echo "needs_migration=true" >> $GITHUB_OUTPUT
              echo "needs_tests=true" >> $GITHUB_OUTPUT
              echo "build_command=" >> $GITHUB_OUTPUT
              echo "test_command=pytest" >> $GITHUB_OUTPUT
              echo "health_endpoint=/health" >> $GITHUB_OUTPUT
              echo "port=8080" >> $GITHUB_OUTPUT
              CLOUD_RUN_CONFIG='{"memory":"1Gi","cpu":"2","max_instances":"10","min_instances":"1","concurrency":"1000","timeout":"300"}'
              echo "cloud_run_config=$CLOUD_RUN_CONFIG" >> $GITHUB_OUTPUT
              ;;
            "company-service")
              SERVICE_CONFIG='{"type":"backend","language":"python","framework":"fastapi","has_migration":true,"has_tests":true}'
              echo "service_config=$SERVICE_CONFIG" >> $GITHUB_OUTPUT
              echo "service_name=${{ inputs.environment }}-company-service" >> $GITHUB_OUTPUT
              echo "service_path=apps/backend/company-service" >> $GITHUB_OUTPUT
              echo "dockerfile_path=apps/backend/company-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "image_name=company-service" >> $GITHUB_OUTPUT
              echo "needs_migration=true" >> $GITHUB_OUTPUT
              echo "needs_tests=true" >> $GITHUB_OUTPUT
              echo "build_command=" >> $GITHUB_OUTPUT
              echo "test_command=pytest" >> $GITHUB_OUTPUT
              echo "health_endpoint=/health" >> $GITHUB_OUTPUT
              echo "port=8080" >> $GITHUB_OUTPUT
              CLOUD_RUN_CONFIG='{"memory":"1Gi","cpu":"2","max_instances":"10","min_instances":"1","concurrency":"1000","timeout":"300"}'
              echo "cloud_run_config=$CLOUD_RUN_CONFIG" >> $GITHUB_OUTPUT
              ;;
            "shell"|"admin"|"learner"|"auth")
              SERVICE_CONFIG='{"type":"frontend","language":"typescript","framework":"react","has_migration":false,"has_tests":true}'
              echo "service_config=$SERVICE_CONFIG" >> $GITHUB_OUTPUT
              echo "service_name=skillforge-${{ inputs.service }}-${{ inputs.environment }}" >> $GITHUB_OUTPUT
              echo "service_path=apps/frontend/${{ inputs.service }}" >> $GITHUB_OUTPUT
              echo "dockerfile_path=apps/frontend/${{ inputs.service }}/Dockerfile" >> $GITHUB_OUTPUT
              echo "image_name=${{ inputs.service }}" >> $GITHUB_OUTPUT
              echo "needs_migration=false" >> $GITHUB_OUTPUT
              echo "needs_tests=true" >> $GITHUB_OUTPUT
              echo "build_command=pnpm run build" >> $GITHUB_OUTPUT
              echo "test_command=pnpm run test:run" >> $GITHUB_OUTPUT
              echo "health_endpoint=/health" >> $GITHUB_OUTPUT
              echo "port=80" >> $GITHUB_OUTPUT
              CLOUD_RUN_CONFIG='{"memory":"1Gi","cpu":"1","max_instances":"10","min_instances":"0","concurrency":"100","timeout":"300"}'
              echo "cloud_run_config=$CLOUD_RUN_CONFIG" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Unknown service: ${{ inputs.service }}"
              exit 1
              ;;
          esac

      - name: Check for changes
        id: changes
        run: |
          if [[ "${{ inputs.force_deploy }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "🚀 Force deploy or manual trigger - will deploy"
          else
            # Check if there are changes in the service path
            SERVICE_PATH="${{ steps.setup.outputs.service_path }}"

            # Get changed files in the last commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

            if echo "$CHANGED_FILES" | grep -q "^$SERVICE_PATH/"; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "✅ Changes detected in $SERVICE_PATH - will deploy"
            else
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              echo "⏭️ No changes detected in $SERVICE_PATH - skipping deployment"
            fi
          fi

      - name: Configuration summary
        run: |
          echo "📋 Deployment Configuration"
          echo "=========================="
          echo "Service: ${{ inputs.service }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Build Type: ${{ inputs.build_type }}"
          echo "Service Name: ${{ steps.setup.outputs.service_name }}"
          echo "Service Path: ${{ steps.setup.outputs.service_path }}"
          echo "Should Deploy: ${{ steps.changes.outputs.should_deploy }}"
          echo "Skip Migration: ${{ inputs.skip_migration }}"
          echo "Skip Tests: ${{ inputs.skip_tests }}"

  # Security validation
  security-validation:
    name: Security Validation
    needs: config
    if: needs.config.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ${{ needs.config.outputs.service_path }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Test execution
  test:
    name: Run Tests
    needs: [config, security-validation]
    if: needs.config.outputs.should_deploy == 'true' && !inputs.skip_tests && needs.config.outputs.needs_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python (Backend)
        if: contains(fromJson(needs.config.outputs.service_config).type, 'backend')
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js with pnpm (Frontend)
        if: contains(fromJson(needs.config.outputs.service_config).type, 'frontend')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm (Frontend)
        if: contains(fromJson(needs.config.outputs.service_config).type, 'frontend')
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Cache dependencies (Frontend)
        if: contains(fromJson(needs.config.outputs.service_config).type, 'frontend')
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            ${{ needs.config.outputs.service_path }}/node_modules
          key: ${{ runner.os }}-pnpm-${{ needs.config.outputs.service }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ needs.config.outputs.service }}-
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: ${{ needs.config.outputs.service_path }}
        run: |
          if [[ "${{ fromJson(needs.config.outputs.service_config).type }}" == "backend" ]]; then
            pip install -r requirements.txt
            pip install pytest pytest-cov
          else
            cd ../../../
            pnpm install --no-frozen-lockfile
          fi

      - name: Run tests
        working-directory: ${{ needs.config.outputs.service_path }}
        run: |
          echo "🧪 Running tests for ${{ inputs.service }}..."
          ${{ needs.config.outputs.test_command }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.service }}
          path: |
            ${{ needs.config.outputs.service_path }}/coverage
            ${{ needs.config.outputs.service_path }}/.coverage
            ${{ needs.config.outputs.service_path }}/test-results.xml

  # Build and push Docker image
  build:
    name: Build & Push Docker Image
    needs: [config, security-validation, test]
    if: always() && needs.config.outputs.should_deploy == 'true' && needs.security-validation.result == 'success' && (needs.test.result == 'success' || inputs.skip_tests)
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with pnpm (Frontend)
        if: contains(fromJson(needs.config.outputs.service_config).type, 'frontend')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm (Frontend)
        if: contains(fromJson(needs.config.outputs.service_config).type, 'frontend')
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Cache dependencies (Frontend)
        if: contains(fromJson(needs.config.outputs.service_config).type, 'frontend')
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            ${{ needs.config.outputs.service_path }}/node_modules
          key: ${{ runner.os }}-pnpm-${{ needs.config.outputs.service }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ needs.config.outputs.service }}-
            ${{ runner.os }}-pnpm-

      - name: Install dependencies and build (Frontend)
        if: contains(fromJson(needs.config.outputs.service_config).type, 'frontend')
        working-directory: ${{ needs.config.outputs.service_path }}
        run: |
          cd ../../../
          pnpm install --no-frozen-lockfile
          cd ${{ needs.config.outputs.service_path }}
          ${{ needs.config.outputs.build_command }}
        env:
          NODE_ENV: production
          VITE_ENVIRONMENT: ${{ inputs.environment }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac'

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ needs.config.outputs.image_name }}:${{ github.sha }}"
          LATEST_URI="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ needs.config.outputs.image_name }}:latest"
          ENV_URI="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ needs.config.outputs.image_name }}:${{ inputs.environment }}"

          echo "🐳 Building Docker image for ${{ inputs.service }}..."
          docker build \
            --no-cache \
            --pull \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ github.sha }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "service=${{ inputs.service }}" \
            --label "environment=${{ inputs.environment }}" \
            -t $IMAGE_URI \
            -t $LATEST_URI \
            -t $ENV_URI \
            -f ${{ needs.config.outputs.dockerfile_path }} .

          echo "📤 Pushing Docker image..."
          docker push $IMAGE_URI
          docker push $LATEST_URI
          docker push $ENV_URI

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "✅ Docker image built and pushed successfully"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.build.outputs.image_uri }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-image-results.sarif'

  # Database migration (Backend services only)
  migrate:
    name: Run Database Migration
    needs: [config, build]
    if: needs.config.outputs.should_deploy == 'true' && needs.build.result == 'success' && needs.config.outputs.needs_migration == 'true' && !inputs.skip_migration
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac'

      - name: Run database migration
        run: |
          echo "🗄️ Running database migration for ${{ inputs.service }}..."

          # Get database URL based on environment
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            DB_URL="${{ secrets.DATABASE_URL_PRODUCTION }}"
          else
            DB_URL="${{ secrets.DATABASE_URL_STAGING }}"
          fi

          # Create and run migration job
          JOB_NAME="migrate-${{ inputs.service }}-${{ github.run_number }}"

          gcloud run jobs create $JOB_NAME \
            --image=${{ needs.build.outputs.image_uri }} \
            --region=${{ env.REGION }} \
            --command="alembic" \
            --args="upgrade,head" \
            --set-env-vars="DATABASE_URL=$DB_URL" \
            --max-retries=3 \
            --parallelism=1 \
            --task-timeout=600 \
            --vpc-connector=skillforge-vpc-connector \
            --vpc-egress=private-ranges-only \
            --service-account=skillforge-cloud-run@${{ env.PROJECT_ID }}.iam.gserviceaccount.com || true

          # Execute migration
          gcloud run jobs execute $JOB_NAME \
            --region=${{ env.REGION }} \
            --wait

          echo "✅ Database migration completed"

  # Deploy to Cloud Run
  deploy:
    name: Deploy to Cloud Run
    needs: [config, build, migrate]
    if: always() && needs.config.outputs.should_deploy == 'true' && needs.build.result == 'success' && (needs.migrate.result == 'success' || needs.config.outputs.needs_migration == 'false' || inputs.skip_migration)
    runs-on: ubuntu-latest
    outputs:
      service_url: ${{ steps.deploy.outputs.service_url }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac'

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          echo "🚀 Deploying ${{ inputs.service }} to Cloud Run..."

          SERVICE_NAME="${{ needs.config.outputs.service_name }}"
          CONFIG=$(echo '${{ needs.config.outputs.cloud_run_config }}' | jq -r .)

          # Extract Cloud Run configuration
          MEMORY=$(echo $CONFIG | jq -r .memory)
          CPU=$(echo $CONFIG | jq -r .cpu)
          MAX_INSTANCES=$(echo $CONFIG | jq -r .max_instances)
          MIN_INSTANCES=$(echo $CONFIG | jq -r .min_instances)
          CONCURRENCY=$(echo $CONFIG | jq -r .concurrency)
          TIMEOUT=$(echo $CONFIG | jq -r .timeout)

          # Deploy to Cloud Run
          gcloud run deploy $SERVICE_NAME \
            --image=${{ needs.build.outputs.image_uri }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --port=${{ needs.config.outputs.port }} \
            --memory=$MEMORY \
            --cpu=$CPU \
            --min-instances=$MIN_INSTANCES \
            --max-instances=$MAX_INSTANCES \
            --concurrency=$CONCURRENCY \
            --timeout=$TIMEOUT \
            --set-env-vars="SERVICE_NAME=$SERVICE_NAME" \
            --set-env-vars="ENVIRONMENT=${{ inputs.environment }}" \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }}" \
            --service-account=skillforge-cloud-run@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --labels="app=skillforge,service=${{ inputs.service }},environment=${{ inputs.environment }}" \
            --revision-suffix="${{ github.sha }}-${{ github.run_number }}" \
            --tag="${{ inputs.environment }}" \
            --allow-unauthenticated

          # Get service URL
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
            --platform=managed \
            --region=${{ env.REGION }} \
            --format="value(status.url)")

          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "✅ Service deployed at: $SERVICE_URL"

      - name: Configure IAM permissions
        run: |
          echo "🔒 Configuring IAM permissions..."

          # Grant API Gateway access for backend services
          if [[ "${{ fromJson(needs.config.outputs.service_config).type }}" == "backend" ]]; then
            gcloud run services add-iam-policy-binding ${{ needs.config.outputs.service_name }} \
              --region=${{ env.REGION }} \
              --member="serviceAccount:api-gateway-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
              --role="roles/run.invoker" || true
          fi

  # Health check and validation
  health-check:
    name: Health Check & Validation
    needs: [config, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for service to be ready
        run: sleep 30

      - name: Perform health check
        run: |
          echo "🔍 Performing health check on ${{ needs.deploy.outputs.service_url }}..."

          HEALTH_URL="${{ needs.deploy.outputs.service_url }}${{ needs.config.outputs.health_endpoint }}"
          MAX_ATTEMPTS=10
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."

            if curl -f -s "$HEALTH_URL" > /dev/null; then
              echo "✅ Health check passed!"
              break
            else
              echo "❌ Health check failed, retrying in 30 seconds..."
              sleep 30
              ((ATTEMPT++))
            fi
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "🚨 Health check failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Performance test
        run: |
          echo "⚡ Running basic performance test..."

          RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}' ${{ needs.deploy.outputs.service_url }})
          echo "Response time: ${RESPONSE_TIME}s"

          if (( $(echo "$RESPONSE_TIME > 5" | bc -l) )); then
            echo "⚠️ Warning: Response time is slow (${RESPONSE_TIME}s)"
          else
            echo "✅ Response time is acceptable (${RESPONSE_TIME}s)"
          fi

  # Cleanup old resources
  cleanup:
    name: Cleanup Resources
    needs: [config, health-check]
    if: always() && needs.health-check.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac'

      - name: Cleanup old revisions
        run: |
          echo "🧹 Cleaning up old revisions..."

          SERVICE_NAME="${{ needs.config.outputs.service_name }}"

          # Keep only the 5 most recent revisions
          gcloud run revisions list \
            --service=$SERVICE_NAME \
            --region=${{ env.REGION }} \
            --format="value(metadata.name)" \
            --sort-by="~metadata.creationTimestamp" \
            --limit=100 | tail -n +6 | while read revision; do
            if [ -n "$revision" ]; then
              echo "Deleting old revision: $revision"
              gcloud run revisions delete $revision --region=${{ env.REGION }} --quiet || true
            fi
          done

      - name: Cleanup old migration jobs
        if: needs.config.outputs.needs_migration == 'true'
        run: |
          echo "🧹 Cleaning up old migration jobs..."

          # Delete migration jobs older than 3 days
          gcloud run jobs list \
            --region=${{ env.REGION }} \
            --filter="metadata.name:migrate-${{ inputs.service }}-* AND metadata.creationTimestamp<'-P3D'" \
            --format="value(metadata.name)" | while read job; do
            if [ -n "$job" ]; then
              echo "Deleting old migration job: $job"
              gcloud run jobs delete $job --region=${{ env.REGION }} --quiet || true
            fi
          done

  # Notification and summary
  notify:
    name: Send Notifications & Summary
    needs: [config, security-validation, test, build, migrate, deploy, health-check, cleanup]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.determine-status.outputs.status }}
    steps:
      - name: Determine overall status
        id: determine-status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" && "${{ needs.health-check.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "overall_status=✅ SUCCESS" >> $GITHUB_ENV
          elif [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "status=partial" >> $GITHUB_OUTPUT
            echo "overall_status=⚠️ PARTIAL SUCCESS" >> $GITHUB_ENV
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "overall_status=❌ FAILURE" >> $GITHUB_ENV
          fi

      - name: Generate deployment summary
        run: |
          cat > deployment-summary.md << EOF
          # 🚀 Deployment Summary

          **Service:** ${{ inputs.service }}
          **Environment:** ${{ inputs.environment }}
          **Status:** ${{ env.overall_status }}
          **Image:** \`${{ needs.build.outputs.image_uri }}\`
          **Service URL:** ${{ needs.deploy.outputs.service_url }}
          **Deployment Time:** $(date)
          **Commit:** ${{ github.sha }}
          **Triggered By:** ${{ github.actor }}

          ## Pipeline Results

          | Stage | Status | Details |
          |--------|---------|---------|
          | Security Validation | ${{ needs.security-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} | Trivy security scan |
          | Tests | ${{ needs.test.result == 'success' && '✅ Passed' || needs.test.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Unit and integration tests |
          | Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} | Docker image build and push |
          | Migration | ${{ needs.migrate.result == 'success' && '✅ Passed' || needs.migrate.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Database migration |
          | Deployment | ${{ needs.deploy.result == 'success' && '✅ Passed' || '❌ Failed' }} | Cloud Run deployment |
          | Health Check | ${{ needs.health-check.result == 'success' && '✅ Passed' || '❌ Failed' }} | Service health verification |
          | Cleanup | ${{ needs.cleanup.result == 'success' && '✅ Passed' || '❌ Failed' }} | Resource cleanup |

          ## Configuration Used

          - **Build Type:** ${{ inputs.build_type }}
          - **Skip Migration:** ${{ inputs.skip_migration }}
          - **Skip Tests:** ${{ inputs.skip_tests }}
          - **Force Deploy:** ${{ inputs.force_deploy }}

          EOF

      - name: Add to step summary
        run: |
          cat deployment-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report-${{ inputs.service }}-${{ inputs.environment }}
          path: deployment-summary.md

  # Rollback on failure (Production only)
  rollback:
    name: Rollback on Failure
    needs: [config, deploy, health-check]
    if: failure() && inputs.environment == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac'

      - name: Rollback to previous revision
        run: |
          echo "🔄 Rolling back ${{ inputs.service }} to previous revision..."

          SERVICE_NAME="${{ needs.config.outputs.service_name }}"

          # Get previous revision
          PREVIOUS_REVISION=$(gcloud run revisions list \
            --service=$SERVICE_NAME \
            --region=${{ env.REGION }} \
            --format="value(metadata.name)" \
            --sort-by="~metadata.creationTimestamp" \
            --limit=2 | tail -1)

          if [ -n "$PREVIOUS_REVISION" ]; then
            echo "Rolling back to revision: $PREVIOUS_REVISION"
            gcloud run services update-traffic $SERVICE_NAME \
              --region=${{ env.REGION }} \
              --to-revisions="$PREVIOUS_REVISION=100" \
              --quiet
            echo "✅ Rollback completed successfully"
          else
            echo "❌ No previous revision found for rollback"
          fi

      - name: Notify rollback completion
        run: |
          echo "🔄 **ROLLBACK COMPLETED**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ inputs.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason:** Deployment failure detected" >> $GITHUB_STEP_SUMMARY
          echo "- **Rollback Time:** $(date)" >> $GITHUB_STEP_SUMMARY