name: Deploy Shell Direct to Cloud Run

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/frontend/shell/**'
      - '.github/workflows/deploy-shell-direct.yml'
  workflow_dispatch:

env:
  PROJECT_ID: skillforge-ai-mvp-25
  REGION: us-central1
  SERVICE: skillforge-shell

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Build Application
        working-directory: apps/frontend/shell
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build || npx vite build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build and Push Docker image
        run: |
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }} \
                       -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:latest \
                       -f apps/frontend/shell/Dockerfile.prod \
                       apps/frontend/shell

          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=80 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=10 \
            --timeout=60

      - name: Configure Domain Mappings
        run: |
          # Create domain mapping for skillforge-ai.emacsah.com
          gcloud run domain-mappings create \
            --service=${{ env.SERVICE }} \
            --domain=skillforge-ai.emacsah.com \
            --region=${{ env.REGION }} || echo "Domain mapping already exists"

          # Create domain mapping for api.emacsah.com
          gcloud run domain-mappings create \
            --service=${{ env.SERVICE }} \
            --domain=api.emacsah.com \
            --region=${{ env.REGION }} || echo "Domain mapping already exists"

      - name: Get Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")

          echo "🎉 Deployment successful!"
          echo "Service URL: ${SERVICE_URL}"
          echo "Custom domains:"
          echo "  - https://skillforge-ai.emacsah.com"
          echo "  - https://api.emacsah.com"