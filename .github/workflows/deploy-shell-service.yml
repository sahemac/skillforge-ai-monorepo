name: Deploy Shell Service to Cloud Run

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/frontend/shell/**'
      - 'packages/**'
      - '.github/workflows/deploy-shell-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/frontend/shell/**'
      - 'packages/**'
      - '.github/workflows/deploy-shell-service.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deployment even without changes'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: europe-west1-docker.pkg.dev
  PROJECT_ID: skillforge-ai-mvp-25
  REGION: europe-west1
  REPOSITORY: skillforge-ai-registry
  SERVICE_NAME: skillforge-shell-gateway

jobs:
  detect-changes:
    name: Detect Changes & Set Environment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.changes.outputs.shell == 'true' || github.event.inputs.force_deploy == 'true' || github.event_name == 'workflow_dispatch' }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            shell:
              - 'apps/frontend/shell/**'
              - 'packages/**'

      - name: Set environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should_deploy == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/frontend/shell'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-deploy:
    name: Build & Deploy Shell Service
    runs-on: ubuntu-latest
    needs: [detect-changes, security-scan]
    if: needs.detect-changes.outputs.should_deploy == 'true'
    environment: ${{ needs.detect-changes.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js with pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'
          run_install: false

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            apps/frontend/shell/node_modules
          key: ${{ runner.os }}-pnpm-shell-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-shell-
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          echo "📎 Installing workspace dependencies with pnpm..."
          pnpm install --no-frozen-lockfile
          echo "✅ Dependencies installed"

      - name: Install globals for ESLint
        run: |
          echo "🔧 Installing globals for ESLint..."
          pnpm add -D globals
          echo "✅ globals installed"

      - name: Debug environment
        run: |
          echo "Node version: $(node -v)"
          echo "PNPM version: $(pnpm -v)"
          echo "Working directory: $(pwd)"
          echo "Shell service directory contents:"
          ls -la apps/frontend/shell/
          echo "Environment: ${{ needs.detect-changes.outputs.environment }}"

      - name: Lint code
        working-directory: apps/frontend/shell
        run: |
          echo "🔍 Linting code..."
          pnpm run lint
          pnpm run format:check
          echo "✅ Linting completed"

      - name: Type check
        working-directory: apps/frontend/shell
        run: |
          echo "📝 Type checking..."
          pnpm run type-check
          echo "✅ Type check completed"

      - name: Run unit tests
        working-directory: apps/frontend/shell
        run: |
          echo "🧪 Running unit tests..."
          pnpm run test:run
          pnpm run test:coverage
          echo "✅ Tests completed"
        env:
          CI: true

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/frontend/shell/coverage/lcov.info
          flags: frontend-shell
          name: shell-service-coverage

      - name: Build application
        working-directory: apps/frontend/shell
        run: |
          echo "🛠️ Building shell service..."
          pnpm run build
          echo "✅ Build completed"
          echo "Build output:"
          ls -la dist/
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH_DOMAIN: ${{ vars.VITE_AUTH_DOMAIN }}
          VITE_ENVIRONMENT: ${{ needs.detect-changes.outputs.environment }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build and push Docker image
        working-directory: apps/frontend/shell
        run: |
          IMAGE_TAG="$REGISTRY/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:${{ github.sha }}"
          LATEST_TAG="$REGISTRY/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:latest"
          ENV_TAG="$REGISTRY/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:${{ needs.detect-changes.outputs.environment }}"

          echo "🐳 Building Docker image..."
          docker build -t $IMAGE_TAG -t $LATEST_TAG -t $ENV_TAG .
          
          echo "📤 Pushing Docker image..."
          docker push $IMAGE_TAG
          docker push $LATEST_TAG
          docker push $ENV_TAG

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "✅ Docker image built and pushed successfully"

      - name: Deploy to Cloud Run
        run: |
          SERVICE_NAME_ENV="${SERVICE_NAME}-${{ needs.detect-changes.outputs.environment }}"
          
          echo "🚀 Deploying to Cloud Run..."
          echo "Service Name: $SERVICE_NAME_ENV"
          echo "Image: ${{ env.IMAGE_TAG }}"
          echo "Environment: ${{ needs.detect-changes.outputs.environment }}"

          gcloud run deploy $SERVICE_NAME_ENV \
            --image=${{ env.IMAGE_TAG }} \
            --platform=managed \
            --region=$REGION \
            --allow-unauthenticated \
            --port=80 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=100 \
            --timeout=300 \
            --set-env-vars="ENVIRONMENT=${{ needs.detect-changes.outputs.environment }}" \
            --labels="app=skillforge-shell,component=gateway,environment=${{ needs.detect-changes.outputs.environment }}" \
            --tag="${{ needs.detect-changes.outputs.environment }}" \
            --revision-suffix="${{ github.sha }}-${{ github.run_number }}" \
            --no-traffic

          NEW_REVISION_URL=$(gcloud run services describe $SERVICE_NAME_ENV \
            --platform=managed \
            --region=$REGION \
            --format="value(status.traffic[0].url)" \
            --filter="metadata.name:$SERVICE_NAME_ENV")

          echo "NEW_REVISION_URL=$NEW_REVISION_URL" >> $GITHUB_ENV
          echo "SERVICE_NAME_ENV=$SERVICE_NAME_ENV" >> $GITHUB_ENV

      - name: Health check new revision
        run: |
          echo "🔍 Performing health check on new revision..."
          echo "Health check URL: ${{ env.NEW_REVISION_URL }}/health"

          sleep 30

          MAX_ATTEMPTS=10
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."

            if curl -f -s "${{ env.NEW_REVISION_URL }}/health" > /dev/null; then
              echo "✅ Health check passed!"
              break
            else
              echo "❌ Health check failed, retrying in 30 seconds..."
              sleep 30
              ((ATTEMPT++))
            fi
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "🚨 Health check failed after $MAX_ATTEMPTS attempts"
            echo "Attempting to get service logs..."
            gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.SERVICE_NAME_ENV }}" --limit=50 --format="table(timestamp,textPayload)" || true
            exit 1
          fi

      - name: Gradual traffic rollout
        run: |
          if [[ "${{ needs.detect-changes.outputs.environment }}" == "production" ]]; then
            echo "🚀 Starting gradual rollout to production..."

            # 10% traffic
            gcloud run services update-traffic ${{ env.SERVICE_NAME_ENV }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=10"
            echo "✅ 10% traffic routed to new revision"
            sleep 120

            # 50% traffic
            gcloud run services update-traffic ${{ env.SERVICE_NAME_ENV }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=50"
            echo "✅ 50% traffic routed to new revision"
            sleep 120

            # 100% traffic
            gcloud run services update-traffic ${{ env.SERVICE_NAME_ENV }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=100"
            echo "✅ 100% traffic routed to new revision"
          else
            # Staging: route all traffic immediately
            gcloud run services update-traffic ${{ env.SERVICE_NAME_ENV }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=100"
            echo "✅ All traffic routed to new revision in staging"
          fi

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME_ENV }} \
            --platform=managed \
            --region=$REGION \
            --format="value(status.url)")
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
          echo "🌐 Shell Service deployed at: $SERVICE_URL"

      - name: Performance test
        run: |
          echo "🔍 Running performance tests..."
          RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}' ${{ env.SERVICE_URL }})
          echo "Response time: ${RESPONSE_TIME}s"
          if (( $(echo "$RESPONSE_TIME > 3" | bc -l) )); then
            echo "⚠️ Warning: Response time is slow (${RESPONSE_TIME}s)"
          else
            echo "✅ Response time is acceptable (${RESPONSE_TIME}s)"
          fi

      - name: Setup custom domain (production only)
        if: needs.detect-changes.outputs.environment == 'production'
        run: |
          echo "🌐 Setting up custom domain mapping..."
          
          # Map the custom domain to the Cloud Run service
          gcloud run domain-mappings create \
            --service=${{ env.SERVICE_NAME_ENV }} \
            --domain=skillforge-ai.emacsah.com \
            --region=$REGION \
            --platform=managed || echo "Domain mapping already exists or failed"
          
          echo "✅ Custom domain setup completed"
          echo "🌐 Production URL: https://skillforge-ai.emacsah.com"

      - name: Cleanup old revisions
        run: |
          echo "🧹 Cleaning up old revisions..."
          gcloud run revisions list \
            --service=${{ env.SERVICE_NAME_ENV }} \
            --region=$REGION \
            --format="value(metadata.name)" \
            --sort-by="~metadata.creationTimestamp" \
            --limit=100 | tail -n +6 | while read revision; do
            if [ -n "$revision" ]; then
              echo "Deleting old revision: $revision"
              gcloud run revisions delete $revision --region=$REGION --quiet || true
            fi
          done

      - name: Deployment summary
        run: |
          echo "📋 Deployment Summary"
          echo "==================="
          echo "Service: ${{ env.SERVICE_NAME_ENV }}"
          echo "Environment: ${{ needs.detect-changes.outputs.environment }}"
          echo "Image: ${{ env.IMAGE_TAG }}"
          echo "URL: ${{ env.SERVICE_URL }}"
          if [[ "${{ needs.detect-changes.outputs.environment }}" == "production" ]]; then
            echo "Custom Domain: https://skillforge-ai.emacsah.com"
          fi
          echo "Revision: ${{ github.sha }}-${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed at: $(date)"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-deploy]
    if: failure() && needs.detect-changes.outputs.environment == 'production'
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Rollback to previous revision
        run: |
          echo "🔄 Rolling back shell service to previous revision..."
          SERVICE_NAME_ENV="${SERVICE_NAME}-production"
          
          PREVIOUS_REVISION=$(gcloud run revisions list \
            --service=$SERVICE_NAME_ENV \
            --region=$REGION \
            --format="value(metadata.name)" \
            --sort-by="~metadata.creationTimestamp" \
            --limit=2 | tail -1)
          
          if [ -n "$PREVIOUS_REVISION" ]; then
            echo "Rolling back $SERVICE_NAME_ENV to $PREVIOUS_REVISION"
            gcloud run services update-traffic $SERVICE_NAME_ENV \
              --region=$REGION \
              --to-revisions="$PREVIOUS_REVISION=100" \
              --quiet
            echo "✅ Rollback completed"
          else
            echo "❌ No previous revision found for rollback"
          fi

      - name: Log rollback completion
        run: |
          echo "🔄 Shell Service Production Rollback Completed"
          echo "Reason: Deployment failure detected"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date)"