name: "Deploy - Shell Service"

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/frontend/shell/**'
      - 'packages/**'
      - '.github/workflows/deploy-shell-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/frontend/shell/**'
      - 'packages/**'
      - '.github/workflows/deploy-shell-service.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deployment even without changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

jobs:
  deploy-shell-service:
    name: Deploy Shell Service
    # Skip for PR events (only build/test, don't deploy)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: 'shell'
      environment: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
      build_type: 'frontend'
      skip_migration: true
      skip_tests: false
      force_deploy: ${{ inputs.force_deploy || github.event_name == 'workflow_dispatch' }}
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_CICD_SERVICE_ACCOUNT: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}

  # For PR events, just run tests and security scans without deploying
  test-and-scan-pr:
    name: Test & Security Scan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/frontend/shell'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Set up Node.js with pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run tests
        working-directory: apps/frontend/shell
        run: |
          pnpm run test:run
          pnpm run type-check
          pnpm run lint