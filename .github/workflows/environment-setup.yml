name: Environment Configuration & Secrets Management

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to configure'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Action to perform'
        required: true
        default: 'update'
        type: choice
        options:
          - validate
          - update
          - rotate-secrets
  schedule:
    # Run secrets validation daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PROJECT_ID: skillforge-ai-mvp-25
  REGION: europe-west1

jobs:
  validate-secrets:
    name: Validate Secrets Configuration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate required secrets
        run: |
          echo "🔍 Validating secrets for ${{ matrix.environment }} environment..."
          
          # List of required secrets for SkillForge AI
          REQUIRED_SECRETS=(
            "DATABASE_URL"
            "REDIS_URL"
            "SECRET_KEY"
            "JWT_SECRET_KEY"
            "WIF_PROVIDER"
            "WIF_SERVICE_ACCOUNT"
            "TF_STATE_BUCKET"
          )
          
          MISSING_SECRETS=()
          
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if [[ -z "${!secret:-}" ]]; then
              MISSING_SECRETS+=("$secret")
              echo "❌ Missing secret: $secret"
            else
              echo "✅ Found secret: $secret"
            fi
          done
          
          if [[ ${#MISSING_SECRETS[@]} -gt 0 ]]; then
            echo "🚨 Missing secrets detected in ${{ matrix.environment }}: ${MISSING_SECRETS[*]}"
            echo "missing_secrets=${MISSING_SECRETS[*]}" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ All required secrets are configured for ${{ matrix.environment }}"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

      - name: Validate Google Cloud secrets
        run: |
          echo "🔍 Validating Google Cloud Secret Manager secrets..."
          
          # Check if secrets exist in Secret Manager
          CLOUD_SECRETS=(
            "skillforge-jwt-secret-${{ matrix.environment }}"
            "skillforge-database-password-${{ matrix.environment }}"
            "skillforge-redis-password-${{ matrix.environment }}"
            "skillforge-app-secret-${{ matrix.environment }}"
          )
          
          for secret in "${CLOUD_SECRETS[@]}"; do
            if gcloud secrets describe "$secret" --quiet >/dev/null 2>&1; then
              echo "✅ Secret exists in Secret Manager: $secret"
              
              # Check if secret has a current version
              VERSION=$(gcloud secrets versions list "$secret" --limit=1 --format="value(name)" --filter="state:enabled")
              if [[ -n "$VERSION" ]]; then
                echo "✅ Secret has active version: $secret (version: $VERSION)"
              else
                echo "⚠️ Secret exists but has no active version: $secret"
              fi
            else
              echo "❌ Secret not found in Secret Manager: $secret"
            fi
          done

      - name: Test database connectivity
        run: |
          echo "🔍 Testing database connectivity..."
          
          # Use Cloud SQL Proxy for connection test
          if [[ "$DATABASE_URL" =~ postgresql://([^:]+):([^@]+)@([^:]+):([^/]+)/(.+) ]]; then
            DB_USER="${BASH_REMATCH[1]}"
            DB_HOST="${BASH_REMATCH[3]}"
            DB_PORT="${BASH_REMATCH[4]}"
            DB_NAME="${BASH_REMATCH[5]}"
            
            echo "Testing connection to database: $DB_NAME on $DB_HOST:$DB_PORT"
            
            # Test with a simple connection attempt (timeout after 10 seconds)
            timeout 10 bash -c "cat < /dev/null > /dev/tcp/$DB_HOST/$DB_PORT" && \
              echo "✅ Database is reachable" || \
              echo "⚠️ Database connection test failed (this might be expected if using private IP)"
          else
            echo "⚠️ Could not parse DATABASE_URL format"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Test Redis connectivity
        run: |
          echo "🔍 Testing Redis connectivity..."
          
          if [[ "$REDIS_URL" =~ redis://([^:]+):([^@]+)@([^:]+):([^/]+) ]]; then
            REDIS_HOST="${BASH_REMATCH[3]}"
            REDIS_PORT="${BASH_REMATCH[4]}"
            
            echo "Testing connection to Redis: $REDIS_HOST:$REDIS_PORT"
            
            # Test with a simple connection attempt (timeout after 5 seconds)
            timeout 5 bash -c "cat < /dev/null > /dev/tcp/$REDIS_HOST/$REDIS_PORT" && \
              echo "✅ Redis is reachable" || \
              echo "⚠️ Redis connection test failed (this might be expected if using private IP)"
          else
            echo "⚠️ Could not parse REDIS_URL format"
          fi
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}

  update-environment-variables:
    name: Update Environment Variables
    runs-on: ubuntu-latest
    needs: validate-secrets
    if: github.event.inputs.action == 'update' || github.event.inputs.action == 'rotate-secrets'
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update GitHub environment variables
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const environment = '${{ github.event.inputs.environment || "staging" }}';
            
            // Define environment-specific configurations
            const envConfigs = {
              staging: {
                VITE_API_URL: 'https://api-staging.skillforge-ai.com',
                VITE_AUTH_DOMAIN: 'auth-staging.skillforge-ai.com',
                VITE_ENVIRONMENT: 'staging',
                DATABASE_TIER: 'db-f1-micro',
                MAX_INSTANCE_COUNT: '10',
                CPU_LIMIT: '1',
                MEMORY_LIMIT: '1Gi'
              },
              production: {
                VITE_API_URL: 'https://api.skillforge-ai.com',
                VITE_AUTH_DOMAIN: 'auth.skillforge-ai.com',
                VITE_ENVIRONMENT: 'production',
                DATABASE_TIER: 'db-custom-2-4096',
                MAX_INSTANCE_COUNT: '100',
                CPU_LIMIT: '2',
                MEMORY_LIMIT: '2Gi'
              }
            };
            
            const config = envConfigs[environment];
            
            if (!config) {
              throw new Error(`Unknown environment: ${environment}`);
            }
            
            // Update environment variables
            for (const [key, value] of Object.entries(config)) {
              try {
                await github.rest.actions.createOrUpdateEnvironmentVariable({
                  repository_id: context.repo.id,
                  environment_name: environment,
                  variable_name: key,
                  value: value
                });
                console.log(`✅ Updated ${key} = ${value}`);
              } catch (error) {
                console.log(`❌ Failed to update ${key}: ${error.message}`);
              }
            }

      - name: Create or update Cloud Run service configurations
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'staging' }}"
          
          echo "🔧 Updating Cloud Run service configurations for $ENVIRONMENT..."
          
          # Frontend services configuration
          FRONTEND_SERVICES=("shell" "auth" "admin" "company" "learner")
          BACKEND_SERVICES=("user-service" "company-service")
          
          for service in "${FRONTEND_SERVICES[@]}"; do
            SERVICE_NAME="skillforge-frontend-$service-$ENVIRONMENT"
            echo "Updating configuration for $SERVICE_NAME..."
            
            # Update service with new environment variables
            gcloud run services update $SERVICE_NAME \
              --region=$REGION \
              --set-env-vars="ENVIRONMENT=$ENVIRONMENT" \
              --labels="app=skillforge-frontend,component=$service,environment=$ENVIRONMENT" \
              --quiet || echo "⚠️ Service $SERVICE_NAME might not exist yet"
          done
          
          for service in "${BACKEND_SERVICES[@]}"; do
            SERVICE_NAME="skillforge-$service-$ENVIRONMENT"
            echo "Updating configuration for $SERVICE_NAME..."
            
            # Update service with new environment variables and secrets
            gcloud run services update $SERVICE_NAME \
              --region=$REGION \
              --set-env-vars="ENVIRONMENT=$ENVIRONMENT" \
              --set-secrets="JWT_SECRET_KEY=skillforge-jwt-secret-$ENVIRONMENT:latest" \
              --labels="app=skillforge-backend,service=$service,environment=$ENVIRONMENT" \
              --quiet || echo "⚠️ Service $SERVICE_NAME might not exist yet"
          done

  rotate-secrets:
    name: Rotate Secrets
    runs-on: ubuntu-latest
    needs: validate-secrets
    if: github.event.inputs.action == 'rotate-secrets'
    environment: ${{ github.event.inputs.environment }}-secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate new secrets
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          
          echo "🔄 Generating new secrets for $ENVIRONMENT environment..."
          
          # Generate new JWT secret
          NEW_JWT_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(64))")
          
          # Generate new app secret key
          NEW_APP_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(64))")
          
          echo "✅ New secrets generated"
          
          # Store new secrets in Secret Manager
          echo "$NEW_JWT_SECRET" | gcloud secrets versions add "skillforge-jwt-secret-$ENVIRONMENT" --data-file=-
          echo "$NEW_APP_SECRET" | gcloud secrets versions add "skillforge-app-secret-$ENVIRONMENT" --data-file=-
          
          echo "✅ New secret versions created in Secret Manager"

      - name: Update Cloud Run services with new secrets
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          
          echo "🔄 Updating Cloud Run services with new secrets..."
          
          BACKEND_SERVICES=("user-service" "company-service")
          
          for service in "${BACKEND_SERVICES[@]}"; do
            SERVICE_NAME="skillforge-$service-$ENVIRONMENT"
            echo "Updating $SERVICE_NAME with new secrets..."
            
            # Update service to use latest secret versions
            gcloud run services update $SERVICE_NAME \
              --region=$REGION \
              --set-secrets="JWT_SECRET_KEY=skillforge-jwt-secret-$ENVIRONMENT:latest,SECRET_KEY=skillforge-app-secret-$ENVIRONMENT:latest" \
              --quiet || echo "⚠️ Service $SERVICE_NAME might not exist yet"
          done
          
          echo "✅ Services updated with new secrets"

      - name: Cleanup old secret versions
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          
          echo "🧹 Cleaning up old secret versions..."
          
          SECRETS=(
            "skillforge-jwt-secret-$ENVIRONMENT"
            "skillforge-app-secret-$ENVIRONMENT"
          )
          
          for secret in "${SECRETS[@]}"; do
            echo "Cleaning up old versions of $secret..."
            
            # Keep only the latest 3 versions, destroy older ones
            gcloud secrets versions list "$secret" \
              --format="value(name)" \
              --sort-by="~createTime" \
              --limit=100 | tail -n +4 | while read version; do
              echo "Destroying old version: $secret version $version"
              gcloud secrets versions destroy "$version" --secret="$secret" --quiet || true
            done
          done

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: validate-secrets
    if: github.event.inputs.action == 'validate' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Audit IAM permissions
        run: |
          echo "🔍 Auditing IAM permissions..."
          
          # List service accounts
          echo "Service Accounts:"
          gcloud iam service-accounts list --format="table(displayName,email)"
          
          # Check for overprivileged service accounts
          echo "Checking for overprivileged service accounts..."
          gcloud projects get-iam-policy $PROJECT_ID --format=json > iam_policy.json
          
          # Look for accounts with Owner or Editor roles (should be minimal)
          cat iam_policy.json | jq -r '.bindings[] | select(.role == "roles/owner" or .role == "roles/editor") | .members[]' | sort | uniq > privileged_accounts.txt
          
          if [[ -s privileged_accounts.txt ]]; then
            echo "⚠️ Found accounts with high privileges:"
            cat privileged_accounts.txt
          else
            echo "✅ No overprivileged accounts found"
          fi

      - name: Audit secret access
        run: |
          echo "🔍 Auditing secret access patterns..."
          
          # List all secrets
          gcloud secrets list --format="table(name,createTime)"
          
          # Check secret IAM policies
          for secret in $(gcloud secrets list --format="value(name)"); do
            echo "Checking access for secret: $secret"
            gcloud secrets get-iam-policy "$secret" --format=json > "secret_policy_$secret.json"
            
            # Look for unexpected access
            cat "secret_policy_$secret.json" | jq -r '.bindings[]? | select(.role != "roles/secretmanager.secretAccessor") | .role + ": " + (.members | join(", "))'
          done

      - name: Check for unused secrets
        run: |
          echo "🔍 Checking for unused secrets..."
          
          # This is a basic check - in a real environment you'd want more sophisticated usage tracking
          for secret in $(gcloud secrets list --format="value(name)"); do
            LAST_ACCESS=$(gcloud secrets versions list "$secret" --limit=1 --format="value(createTime)")
            echo "Secret: $secret, Last version created: $LAST_ACCESS"
          done

      - name: Generate security report
        run: |
          echo "📊 Generating security audit report..."
          
          cat > security_audit_report.md << EOF
          # SkillForge AI Security Audit Report
          
          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Environment**: All
          **Audit Type**: Scheduled Security Review
          
          ## Summary
          
          - ✅ Secrets validation: PASSED
          - ✅ IAM permissions: REVIEWED
          - ✅ Secret access patterns: AUDITED
          - ✅ Unused secrets: IDENTIFIED
          
          ## Recommendations
          
          1. Regularly rotate secrets (monthly for production)
          2. Review and minimize IAM permissions
          3. Enable audit logging for secret access
          4. Implement secret usage monitoring
          
          ## Next Steps
          
          - Schedule next audit for $(date -d "+1 month" +"%Y-%m-%d")
          - Review any flagged permissions
          - Clean up unused secrets
          
          EOF
          
          cat security_audit_report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report-$(date +%Y%m%d)
          path: |
            security_audit_report.md
            iam_policy.json
            privileged_accounts.txt
            secret_policy_*.json

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [validate-secrets, update-environment-variables, rotate-secrets, security-audit]
    if: always()
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.validate-secrets.result }}" == "success" ]]; then
            if [[ "${{ github.event.inputs.action }}" == "rotate-secrets" && "${{ needs.rotate-secrets.result }}" == "success" ]]; then
              echo "status=success" >> $GITHUB_OUTPUT
              echo "message=Secrets rotation completed successfully" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.inputs.action }}" == "update" && "${{ needs.update-environment-variables.result }}" == "success" ]]; then
              echo "status=success" >> $GITHUB_OUTPUT
              echo "message=Environment configuration updated successfully" >> $GITHUB_OUTPUT
            else
              echo "status=success" >> $GITHUB_OUTPUT
              echo "message=Environment validation completed successfully" >> $GITHUB_OUTPUT
            fi
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Environment configuration or validation failed" >> $GITHUB_OUTPUT
          fi

      - name: Notify via Slack
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: ${{ steps.status.outputs.status }}
          custom_payload: |
            {
              "text": "${{ steps.status.outputs.status == 'success' && '✅' || '❌' }} ${{ steps.status.outputs.message }}",
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    {
                      "title": "Environment",
                      "value": "${{ github.event.inputs.environment || 'All' }}",
                      "short": true
                    },
                    {
                      "title": "Action",
                      "value": "${{ github.event.inputs.action || 'scheduled-audit' }}",
                      "short": true
                    },
                    {
                      "title": "Triggered By",
                      "value": "${{ github.event_name == 'schedule' && 'Scheduled' || github.actor }}",
                      "short": true
                    },
                    {
                      "title": "Workflow",
                      "value": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>",
                      "short": false
                    }
                  ]
                }
              ]
            }