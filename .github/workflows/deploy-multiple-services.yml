name: "Deploy Multiple Services"

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated: user-service,project-service,shell)'
        required: true
        default: 'user-service,project-service'
        type: string
      environment:
        description: 'Target environment'
        required: false
        type: choice
        options:
          - staging
          - production
        default: staging
      skip_migration:
        description: 'Skip database migration for all services'
        required: false
        type: boolean
        default: false
      skip_tests:
        description: 'Skip tests for all services'
        required: false
        type: boolean
        default: false
      force_deploy:
        description: 'Force deployment even without changes'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

jobs:
  # Parse input services and create a matrix
  setup-matrix:
    name: Setup Deployment Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.create-matrix.outputs.matrix }}
    steps:
      - name: Create deployment matrix
        id: create-matrix
        run: |
          # Parse comma-separated services input
          SERVICES="${{ inputs.services }}"

          # Create JSON array from comma-separated input
          IFS=',' read -ra SERVICE_ARRAY <<< "$SERVICES"

          # Build matrix JSON
          MATRIX_JSON='{"service":['
          FIRST=true
          for service in "${SERVICE_ARRAY[@]}"; do
            # Trim whitespace
            service=$(echo "$service" | xargs)

            if [ "$FIRST" = true ]; then
              MATRIX_JSON+="\"$service\""
              FIRST=false
            else
              MATRIX_JSON+=",\"$service\""
            fi
          done
          MATRIX_JSON+=']}'

          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          echo "Generated matrix: $MATRIX_JSON"

  # Deploy services using matrix strategy
  deploy-services:
    name: Deploy ${{ matrix.service }}
    needs: setup-matrix
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
      fail-fast: false # Continue deploying other services even if one fails
      max-parallel: 3 # Limit parallel deployments to avoid resource conflicts

    uses: ./.github/workflows/deploy-service.yml
    with:
      service: ${{ matrix.service }}
      environment: ${{ inputs.environment }}
      build_type: ${{ contains(matrix.service, 'service') && 'backend' || 'frontend' }}
      skip_migration: ${{ inputs.skip_migration }}
      skip_tests: ${{ inputs.skip_tests }}
      force_deploy: ${{ inputs.force_deploy }}
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_CICD_SERVICE_ACCOUNT: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
      DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
      DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}

  # Summary of all deployments
  deployment-summary:
    name: Deployment Summary
    needs: [setup-matrix, deploy-services]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate deployment summary
        run: |
          cat > deployment-summary.md << EOF
          # 🚀 Multi-Service Deployment Summary

          **Environment:** ${{ inputs.environment }}
          **Deployment Time:** $(date)
          **Triggered By:** ${{ github.actor }}
          **Services Requested:** ${{ inputs.services }}

          ## Deployment Results

          | Service | Status | Notes |
          |---------|--------|-------|
          EOF

          # Parse the services that were requested
          IFS=',' read -ra SERVICE_ARRAY <<< "${{ inputs.services }}"

          for service in "${SERVICE_ARRAY[@]}"; do
            service=$(echo "$service" | xargs)
            echo "| $service | ⏳ Check individual job results | Review logs for detailed status |" >> deployment-summary.md
          done

          cat >> deployment-summary.md << EOF

          ## Configuration Used

          - **Skip Migration:** ${{ inputs.skip_migration }}
          - **Skip Tests:** ${{ inputs.skip_tests }}
          - **Force Deploy:** ${{ inputs.force_deploy }}

          ## Next Steps

          1. Review individual service deployment logs
          2. Verify all services are healthy
          3. Update monitoring and alerting if needed
          4. Document any configuration changes

          ---
          *Generated by SkillForge AI Multi-Service Deployment*
          EOF

      - name: Add to step summary
        run: |
          cat deployment-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: multi-service-deployment-report-${{ inputs.environment }}
          path: deployment-summary.md

  # Notification with aggregated results
  notify-results:
    name: Notify Results
    needs: [setup-matrix, deploy-services, deployment-summary]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        id: status
        run: |
          # This would normally check the actual status of each deployment
          # For now, we'll provide a generic summary
          echo "## 🔔 Multi-Service Deployment Notification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services Deployed:** ${{ inputs.services }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**View Details:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY