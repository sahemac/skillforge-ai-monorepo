name: Frontend Applications Deployment

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      apps:
        description: 'Apps to deploy (comma-separated or "all")'
        required: true
        default: 'all'
        type: string

env:
  REGISTRY: gcr.io
  PROJECT_ID: skillforge-ai-mvp-25
  REGION: europe-west1
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.changes.outputs.shell }}
      auth: ${{ steps.changes.outputs.auth }}
      admin: ${{ steps.changes.outputs.admin }}
      company: ${{ steps.changes.outputs.company }}
      learner: ${{ steps.changes.outputs.learner }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            shell:
              - 'apps/frontend/shell/**'
            auth:
              - 'apps/frontend/auth/**'
            admin:
              - 'apps/frontend/admin/**'
            company:
              - 'apps/frontend/company/**'
            learner:
              - 'apps/frontend/learner/**'

      - name: Set environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.apps }}" != "all" ]]; then
            # Manual trigger with specific apps
            IFS=',' read -ra APPS <<< "${{ github.event.inputs.apps }}"
            matrix_apps="["
            for app in "${APPS[@]}"; do
              app=$(echo $app | xargs) # trim whitespace
              matrix_apps="$matrix_apps\"$app\","
            done
            matrix_apps="${matrix_apps%,}]"
          else
            # Auto-detect changed apps or deploy all
            matrix_apps="["
            if [[ "${{ steps.changes.outputs.shell }}" == "true" || "${{ github.event.inputs.apps }}" == "all" ]]; then
              matrix_apps="${matrix_apps}\"shell\","
            fi
            if [[ "${{ steps.changes.outputs.auth }}" == "true" || "${{ github.event.inputs.apps }}" == "all" ]]; then
              matrix_apps="${matrix_apps}\"auth\","
            fi
            if [[ "${{ steps.changes.outputs.admin }}" == "true" || "${{ github.event.inputs.apps }}" == "all" ]]; then
              matrix_apps="${matrix_apps}\"admin\","
            fi
            if [[ "${{ steps.changes.outputs.company }}" == "true" || "${{ github.event.inputs.apps }}" == "all" ]]; then
              matrix_apps="${matrix_apps}\"company\","
            fi
            if [[ "${{ steps.changes.outputs.learner }}" == "true" || "${{ github.event.inputs.apps }}" == "all" ]]; then
              matrix_apps="${matrix_apps}\"learner\","
            fi
            matrix_apps="${matrix_apps%,}]"
          fi
          
          if [[ "$matrix_apps" == "[]" ]]; then
            matrix_apps='["shell"]' # Default fallback
          fi
          
          echo "matrix={\"app\":$matrix_apps}" >> $GITHUB_OUTPUT
          echo "Apps to deploy: $matrix_apps"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"app":[]}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/frontend'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [detect-changes, security-scan]
    if: needs.detect-changes.outputs.matrix != '{"app":[]}'
    environment: ${{ needs.detect-changes.outputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/${{ matrix.app }}/package-lock.json'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            apps/frontend/${{ matrix.app }}/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.app }}-${{ hashFiles('apps/frontend/${{ matrix.app }}/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.app }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: apps/frontend/${{ matrix.app }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint code
        working-directory: apps/frontend/${{ matrix.app }}
        run: |
          npm run lint
          npm run format:check

      - name: Type check
        working-directory: apps/frontend/${{ matrix.app }}
        run: npm run type-check

      - name: Run unit tests
        working-directory: apps/frontend/${{ matrix.app }}
        run: |
          npm run test:run
          npm run test:coverage
        env:
          CI: true

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/frontend/${{ matrix.app }}/coverage/lcov.info
          flags: frontend-${{ matrix.app }}
          name: frontend-${{ matrix.app }}-coverage

      - name: Build application
        working-directory: apps/frontend/${{ matrix.app }}
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH_DOMAIN: ${{ vars.VITE_AUTH_DOMAIN }}
          VITE_ENVIRONMENT: ${{ needs.detect-changes.outputs.environment }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker gcr.io

      - name: Create Dockerfile
        working-directory: apps/frontend/${{ matrix.app }}
        run: |
          cat > Dockerfile << 'EOF'
          # Multi-stage build for optimization
          FROM node:20-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --only=production && npm cache clean --force
          COPY dist ./dist
          
          FROM nginx:alpine AS production
          
          # Security: Run as non-root user
          RUN addgroup -g 1001 -S nodejs && \
              adduser -S nextjs -u 1001
          
          # Copy built application
          COPY --from=builder /app/dist /usr/share/nginx/html
          
          # Create custom nginx config for SPA
          RUN cat > /etc/nginx/conf.d/default.conf << 'NGINX_EOF'
          server {
              listen 8080;
              server_name localhost;
              root /usr/share/nginx/html;
              index index.html;
              
              # Security headers
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-XSS-Protection "1; mode=block" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.skillforge-ai.com;" always;
              
              # Gzip compression
              gzip on;
              gzip_vary on;
              gzip_min_length 1024;
              gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
              
              # SPA routing
              location / {
                  try_files $uri $uri/ /index.html;
              }
              
              # Cache static assets
              location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
              
              # Health check endpoint
              location /health {
                  access_log off;
                  return 200 "healthy\n";
                  add_header Content-Type text/plain;
              }
          }
          NGINX_EOF
          
          # Change ownership and switch to non-root user
          RUN chown -R nodejs:nodejs /usr/share/nginx/html && \
              chown -R nodejs:nodejs /var/cache/nginx && \
              chown -R nodejs:nodejs /var/log/nginx && \
              chown -R nodejs:nodejs /etc/nginx/conf.d
          
          # Change nginx to run on port 8080 (non-privileged)
          RUN sed -i 's/listen 80;/listen 8080;/' /etc/nginx/conf.d/default.conf
          
          USER nodejs
          
          EXPOSE 8080
          
          HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
              CMD curl -f http://localhost:8080/health || exit 1
          
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      - name: Build and push Docker image
        working-directory: apps/frontend/${{ matrix.app }}
        run: |
          IMAGE_TAG="$REGISTRY/$PROJECT_ID/skillforge-frontend-${{ matrix.app }}:${{ github.sha }}"
          LATEST_TAG="$REGISTRY/$PROJECT_ID/skillforge-frontend-${{ matrix.app }}:latest"
          ENV_TAG="$REGISTRY/$PROJECT_ID/skillforge-frontend-${{ matrix.app }}:${{ needs.detect-changes.outputs.environment }}"
          
          docker build -t $IMAGE_TAG -t $LATEST_TAG -t $ENV_TAG .
          docker push $IMAGE_TAG
          docker push $LATEST_TAG
          docker push $ENV_TAG
          
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          SERVICE_NAME="skillforge-frontend-${{ matrix.app }}-${{ needs.detect-changes.outputs.environment }}"
          
          gcloud run deploy $SERVICE_NAME \
            --image=${{ env.IMAGE_TAG }} \
            --platform=managed \
            --region=$REGION \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80 \
            --timeout=300 \
            --set-env-vars="ENVIRONMENT=${{ needs.detect-changes.outputs.environment }}" \
            --labels="app=skillforge-frontend,component=${{ matrix.app }},environment=${{ needs.detect-changes.outputs.environment }}" \
            --tag="${{ needs.detect-changes.outputs.environment }}" \
            --revision-suffix="${{ github.sha }}-${{ github.run_number }}" \
            --no-traffic
          
          # Get the new revision URL
          NEW_REVISION_URL=$(gcloud run services describe $SERVICE_NAME \
            --platform=managed \
            --region=$REGION \
            --format="value(status.traffic[0].url)" \
            --filter="metadata.name:$SERVICE_NAME")
          
          echo "NEW_REVISION_URL=$NEW_REVISION_URL" >> $GITHUB_ENV
          echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV

      - name: Health check new revision
        run: |
          echo "Performing health check on new revision..."
          
          # Wait for service to be ready
          sleep 30
          
          MAX_ATTEMPTS=10
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            if curl -f -s "${{ env.NEW_REVISION_URL }}/health" > /dev/null; then
              echo "✅ Health check passed!"
              break
            else
              echo "❌ Health check failed, retrying in 30 seconds..."
              sleep 30
              ((ATTEMPT++))
            fi
          done
          
          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "🚨 Health check failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Gradual traffic rollout
        run: |
          if [[ "${{ needs.detect-changes.outputs.environment }}" == "production" ]]; then
            echo "🚀 Starting gradual rollout to production..."
            
            # 10% traffic
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=10"
            
            echo "✅ 10% traffic routed to new revision"
            sleep 120  # Wait 2 minutes
            
            # 50% traffic
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=50"
            
            echo "✅ 50% traffic routed to new revision"
            sleep 120  # Wait 2 minutes
            
            # 100% traffic
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=100"
            
            echo "✅ 100% traffic routed to new revision"
          else
            # For staging, route 100% traffic immediately
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=$REGION \
              --to-revisions="${{ github.sha }}-${{ github.run_number }}=100"
            
            echo "✅ All traffic routed to new revision in staging"
          fi

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform=managed \
            --region=$REGION \
            --format="value(status.url)")
          
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
          echo "🌐 Service deployed at: $SERVICE_URL"

      - name: Performance test
        run: |
          echo "🔍 Running performance tests..."
          
          # Basic performance test with curl
          RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}' ${{ env.SERVICE_URL }})
          echo "Response time: ${RESPONSE_TIME}s"
          
          # Check if response time is acceptable (< 2 seconds)
          if (( $(echo "$RESPONSE_TIME > 2" | bc -l) )); then
            echo "⚠️ Warning: Response time is slow (${RESPONSE_TIME}s)"
          else
            echo "✅ Response time is acceptable (${RESPONSE_TIME}s)"
          fi

      - name: Cleanup old revisions
        run: |
          echo "🧹 Cleaning up old revisions..."
          
          # Keep only the last 5 revisions
          gcloud run revisions list \
            --service=${{ env.SERVICE_NAME }} \
            --region=$REGION \
            --format="value(metadata.name)" \
            --sort-by="~metadata.creationTimestamp" \
            --limit=100 | tail -n +6 | while read revision; do
            echo "Deleting old revision: $revision"
            gcloud run revisions delete $revision --region=$REGION --quiet || true
          done

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-deploy]
    if: always() && needs.detect-changes.outputs.matrix != '{"app":[]}'
    steps:
      - name: Notify deployment status
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          custom_payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} Frontend Deployment ${{ job.status }}",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    {
                      "title": "Environment",
                      "value": "${{ needs.detect-changes.outputs.environment }}",
                      "short": true
                    },
                    {
                      "title": "Apps Deployed",
                      "value": "${{ needs.detect-changes.outputs.matrix }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>",
                      "short": true
                    },
                    {
                      "title": "Author",
                      "value": "${{ github.actor }}",
                      "short": true
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-deploy]
    if: failure() && needs.detect-changes.outputs.environment == 'production'
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Rollback to previous revision
        run: |
          echo "🔄 Rolling back to previous revision..."
          
          for app in shell auth admin company learner; do
            SERVICE_NAME="skillforge-frontend-$app-production"
            
            # Get the previous working revision
            PREVIOUS_REVISION=$(gcloud run revisions list \
              --service=$SERVICE_NAME \
              --region=$REGION \
              --format="value(metadata.name)" \
              --sort-by="~metadata.creationTimestamp" \
              --limit=2 | tail -1)
            
            if [ -n "$PREVIOUS_REVISION" ]; then
              echo "Rolling back $SERVICE_NAME to $PREVIOUS_REVISION"
              gcloud run services update-traffic $SERVICE_NAME \
                --region=$REGION \
                --to-revisions="$PREVIOUS_REVISION=100" \
                --quiet
            fi
          done

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: 'warning'
          custom_payload: |
            {
              "text": "🔄 Frontend Production Rollback Completed",
              "attachments": [
                {
                  "color": "warning",
                  "fields": [
                    {
                      "title": "Reason",
                      "value": "Deployment failure detected",
                      "short": false
                    },
                    {
                      "title": "Commit",
                      "value": "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>",
                      "short": true
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}