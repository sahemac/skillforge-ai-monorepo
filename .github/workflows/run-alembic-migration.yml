name: "Reusable - Run Alembic Migration"
on:
  workflow_call:
    inputs:
      service_name:
        description: "Name of the microservice (e.g., user-service)"
        required: true
        type: string
      environment:
        description: "Target environment (staging, production)"
        required: false
        type: string
        default: "staging"
      service_url:
        description: "Service URL for health checks"
        required: false
        type: string
      python_version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.11"
    secrets:
      DATABASE_URL:
        description: "PostgreSQL connection string (fallback)"
        required: false
      GCP_PROJECT_ID:
        description: "Google Cloud Project ID"
        required: true
      GCP_WIF_PROVIDER:
        description: "GCP Workload Identity Federation Provider"
        required: true
      GCP_CICD_SERVICE_ACCOUNT:
        description: "GCP CI/CD Service Account"
        required: true
    outputs:
      migration_status:
        description: "Migration status (success/failed)"
        value: ${{ jobs.migrate.outputs.status }}
      migration_log:
        description: "Migration log file path"
        value: ${{ jobs.migrate.outputs.log_file }}
permissions:
  contents: read

jobs:
  migrate:
    name: Run Database Migration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      status: ${{ steps.migration.outputs.status }}
      log_file: ${{ steps.migration.outputs.log_file }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl netcat-openbsd

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic asyncpg python-dotenv

      - name: Validate service directory
        run: |
          SERVICE_DIR="apps/backend/${{ inputs.service_name }}"
          if [[ ! -d "$SERVICE_DIR" ]]; then
            echo "❌ Service directory not found: $SERVICE_DIR"
            echo "Available services:"
            ls -la apps/backend/ || echo "No backend services found"
            exit 1
          fi

          if [[ ! -f "$SERVICE_DIR/alembic.ini" ]]; then
            echo "❌ Alembic configuration not found: $SERVICE_DIR/alembic.ini"
            echo "Directory contents:"
            ls -la "$SERVICE_DIR/"
            exit 1
          fi

          echo "✅ Service validation passed"
          echo "service_dir=$SERVICE_DIR" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CICD_SERVICE_ACCOUNT }}
          audience: 'https://github.com/sahemac/skillforge-ai-monorepo'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Install Cloud SQL Proxy
        run: |
          echo "🔧 Installing Cloud SQL Proxy..."
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          sudo mv cloud-sql-proxy /usr/local/bin/
          echo "✅ Cloud SQL Proxy installed:"
          cloud-sql-proxy --version

      - name: Get Database Password from Secret Manager
        id: get-db-password
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "🔐 Retrieving database password from Secret Manager..."
          if DB_PASSWORD=$(gcloud secrets versions access latest --secret="postgres-password-staging" --project="$PROJECT_ID" 2>&1); then
            if [[ ! "$DB_PASSWORD" =~ ^ERROR ]]; then
              echo "✅ Retrieved password from Secret Manager"
              echo "db_password=$DB_PASSWORD" >> $GITHUB_OUTPUT
              echo "password_source=secret_manager" >> $GITHUB_OUTPUT
            else
              echo "❌ Secret Manager error: $DB_PASSWORD"
              echo "password_source=database_url" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ gcloud command failed"
            echo "password_source=database_url" >> $GITHUB_OUTPUT
          fi

      - name: Start Cloud SQL Proxy
        if: steps.get-db-password.outputs.password_source == 'secret_manager'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "🚀 Starting Cloud SQL Proxy..."
          INSTANCE_CONNECTION_NAME="$PROJECT_ID:europe-west1:skillforge-pg-instance-staging"
          echo "Instance: $INSTANCE_CONNECTION_NAME"

          # Start Cloud SQL Proxy in background on port 5432 (standard PostgreSQL port)
          cloud-sql-proxy \
            --port=5432 \
            "$INSTANCE_CONNECTION_NAME" &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> $GITHUB_ENV

          echo "⏳ Waiting for Cloud SQL Proxy to be ready..."
          sleep 10

          # Test proxy connection
          if timeout 30 bash -c 'until nc -z localhost 5432; do sleep 1; done'; then
            echo "✅ Cloud SQL Proxy is ready on port 5432"
          else
            echo "❌ Cloud SQL Proxy failed to start"
            echo "Checking proxy process..."
            ps aux | grep cloud-sql-proxy || echo "No proxy process found"
            echo "Checking port 5432..."
            netstat -tuln | grep 5432 || echo "Port 5432 not listening"
            exit 1
          fi

      - name: Install service dependencies
        working-directory: ${{ env.service_dir }}
        run: |
          echo "📦 Installing service dependencies..."
          pip install -r requirements.txt

      - name: Run Database Migration
        id: migration
        working-directory: ${{ env.service_dir }}
        env:
          DATABASE_URL: ${{ steps.get-db-password.outputs.password_source == 'secret_manager' && format('postgresql+asyncpg://skillforge_user:{0}@localhost:5432/skillforge_db', steps.get-db-password.outputs.db_password) || secrets.DATABASE_URL }}
          POSTGRES_USER: "skillforge_user"
          POSTGRES_PASSWORD: ${{ steps.get-db-password.outputs.db_password }}
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          POSTGRES_DB: "skillforge_db"
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE_URL: ${{ inputs.service_url }}
        run: |
          set -euo pipefail

          # Set log file path
          LOG_FILE="/tmp/migrate-${{ inputs.service_name }}-$(date +%Y%m%d-%H%M%S).log"
          echo "log_file=$LOG_FILE" >> $GITHUB_OUTPUT

          echo "🗃️ Running database migration for ${{ inputs.service_name }} in ${{ inputs.environment }} environment..."
          echo ""

          # Show configuration (without revealing password)
          echo "📋 Migration Configuration:"
          echo "  Service: ${{ inputs.service_name }}"
          echo "  Environment: ${{ inputs.environment }}"
          echo "  Database User: $POSTGRES_USER"
          echo "  Database Name: $POSTGRES_DB"
          if [[ "${{ steps.get-db-password.outputs.password_source }}" == "secret_manager" ]]; then
            echo "  Connection: Cloud SQL via proxy (localhost:5432)"
            echo "  Password Source: Secret Manager"
          else
            echo "  Connection: Direct DATABASE_URL"
            echo "  Password Source: GitHub Secrets"
          fi
          echo ""

          # Test database connectivity before migration
          echo "🔍 Testing database connectivity..."
          if [[ "${{ steps.get-db-password.outputs.password_source }}" == "secret_manager" ]]; then
            echo "Testing Cloud SQL Proxy connection..."
            if timeout 10 bash -c 'until nc -z localhost 5432; do sleep 1; done'; then
              echo "✅ Cloud SQL Proxy connection successful"
            else
              echo "❌ Cannot connect to Cloud SQL Proxy on localhost:5432"
              echo "Checking proxy process..."
              ps aux | grep cloud-sql-proxy || echo "No proxy process found"
              echo "Checking port 5432..."
              netstat -tuln | grep 5432 || echo "Port 5432 not listening"
              exit 1
            fi
          fi

          # Run migration using our automatic migration script
          if python run_migrations.py 2>&1 | tee "$LOG_FILE"; then
            echo "✅ Migration completed successfully"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Migration failed"
            echo "status=failed" >> $GITHUB_OUTPUT

            # Show log file contents on failure
            echo "📋 Migration log:"
            if [[ -f "$LOG_FILE" ]]; then
              cat "$LOG_FILE"
            fi

            exit 1
          fi

      - name: Verify Migration Status
        if: steps.migration.outputs.status == 'success'
        working-directory: ${{ env.service_dir }}
        env:
          DATABASE_URL: ${{ steps.get-db-password.outputs.password_source == 'secret_manager' && format('postgresql+asyncpg://skillforge_user:{0}@localhost:5432/skillforge_db', steps.get-db-password.outputs.db_password) || secrets.DATABASE_URL }}
        run: |
          echo "🔍 Verifying migration status..."

          # Show current migration status
          if command -v alembic >/dev/null 2>&1; then
            echo "📊 Current Alembic Status:"
            # Convert async URL to sync for alembic
            SYNC_URL="${DATABASE_URL//postgresql+asyncpg/postgresql}"
            SYNC_URL="${SYNC_URL//sqlite+aiosqlite/sqlite}"
            DATABASE_URL="$SYNC_URL" alembic current -v || echo "⚠️ Could not get current migration status"
          fi

          echo ""
          echo "✅ Migration verification completed"

      - name: Cleanup Cloud SQL Proxy
        if: always() && env.PROXY_PID
        run: |
          echo "🧹 Stopping Cloud SQL Proxy..."
          if [[ -n "$PROXY_PID" ]] && kill -0 "$PROXY_PID" 2>/dev/null; then
            kill "$PROXY_PID"
            echo "✅ Cloud SQL Proxy stopped"
          else
            echo "ℹ️ Cloud SQL Proxy was not running"
          fi

      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-logs-${{ inputs.service_name }}-${{ github.run_number }}
          path: /tmp/migrate-*.log
          retention-days: 30

      - name: Post-migration summary
        if: always()
        run: |
          echo "## 📊 Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ inputs.service_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.migration.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.migration.outputs.status }}" == "success" ]]; then
            echo "- **Result**: ✅ Migration completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Result**: ❌ Migration failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Log**: Check uploaded artifacts for detailed logs" >> $GITHUB_STEP_SUMMARY
          fi
