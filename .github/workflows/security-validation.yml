name: Security Validation & Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - code-only
          - infrastructure-only
          - dependencies-only
      severity_threshold:
        description: 'Minimum severity to report'
        required: false
        default: 'medium'
        type: choice
        options:
          - low
          - medium
          - high
          - critical

env:
  PROJECT_ID: skillforge-ai-mvp-25
  REGION: europe-west1
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.scan_type == 'full' || 
      github.event.inputs.scan_type == 'dependencies-only' || 
      github.event.inputs.scan_type == '' ||
      github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        scan-target:
          - { path: 'apps/frontend', type: 'npm', package-file: 'package.json' }
          - { path: 'apps/backend/user-service', type: 'python', package-file: 'requirements.txt' }
          - { path: 'apps/backend/company-service', type: 'python', package-file: 'requirements.txt' }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (for frontend)
        if: matrix.scan-target.type == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.scan-target.path }}/package-lock.json'

      - name: Set up Python (for backend)
        if: matrix.scan-target.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ${{ matrix.scan-target.path }}
        run: |
          if [[ "${{ matrix.scan-target.type }}" == "npm" ]]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          elif [[ "${{ matrix.scan-target.type }}" == "python" ]]; then
            pip install -r requirements.txt
            pip install safety bandit semgrep
          fi

      - name: Run npm audit (Frontend)
        if: matrix.scan-target.type == 'npm'
        working-directory: ${{ matrix.scan-target.path }}
        continue-on-error: true
        run: |
          npm audit --audit-level=${{ github.event.inputs.severity_threshold || 'moderate' }} --format=json > npm-audit-report.json || true
          npm audit --audit-level=${{ github.event.inputs.severity_threshold || 'moderate' }}

      - name: Run Safety check (Python)
        if: matrix.scan-target.type == 'python'
        working-directory: ${{ matrix.scan-target.path }}
        continue-on-error: true
        run: |
          safety check --json --output safety-report.json || true
          safety check --short-report

      - name: Run Bandit security scan (Python)
        if: matrix.scan-target.type == 'python'
        working-directory: ${{ matrix.scan-target.path }}
        continue-on-error: true
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -ll

      - name: Run Semgrep security scan
        working-directory: ${{ matrix.scan-target.path }}
        continue-on-error: true
        run: |
          pip install semgrep
          semgrep --config=auto --json --output=semgrep-report.json . || true
          semgrep --config=auto .

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-reports-${{ matrix.scan-target.type }}-${{ hashFiles(format('{0}/{1}', matrix.scan-target.path, matrix.scan-target.package-file)) }}
          path: |
            ${{ matrix.scan-target.path }}/*-report.json

  code-quality-scan:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.scan_type == 'full' || 
      github.event.inputs.scan_type == 'code-only' || 
      github.event.inputs.scan_type == '' ||
      github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript,python"

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

      - name: Run ESLint security scan (Frontend)
        run: |
          cd apps/frontend
          npm install eslint-plugin-security --no-save
          npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-security-report.json || true
          npx eslint . --ext .js,.jsx,.ts,.tsx

      - name: Upload code quality reports
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            trivy-fs-results.sarif
            apps/frontend/eslint-security-report.json

  container-security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.scan_type == 'full' || 
      github.event.inputs.scan_type == 'infrastructure-only' || 
      github.event.inputs.scan_type == '' ||
      github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        service:
          - { name: 'frontend-shell', path: 'apps/frontend/shell' }
          - { name: 'frontend-auth', path: 'apps/frontend/auth' }
          - { name: 'backend-user-service', path: 'apps/backend/user-service' }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test Dockerfile for frontend
        if: startsWith(matrix.service.name, 'frontend-')
        working-directory: ${{ matrix.service.path }}
        run: |
          cat > Dockerfile.scan << 'EOF'
          FROM node:20-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --only=production
          COPY . .
          RUN npm run build

          FROM nginx:alpine
          RUN addgroup -g 1001 -S nodejs && \
              adduser -S nextjs -u 1001
          COPY --from=builder /app/dist /usr/share/nginx/html
          USER nodejs
          EXPOSE 8080
          EOF

      - name: Create test Dockerfile for backend
        if: startsWith(matrix.service.name, 'backend-')
        working-directory: ${{ matrix.service.path }}
        run: |
          cat > Dockerfile.scan << 'EOF'
          FROM python:3.11-slim
          RUN groupadd -r appuser && useradd -r -g appuser appuser
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY app/ ./app/
          USER appuser
          EXPOSE 8000
          CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF

      - name: Build test image
        working-directory: ${{ matrix.service.path }}
        run: |
          docker build -f Dockerfile.scan -t skillforge-${{ matrix.service.name }}:scan .

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'skillforge-${{ matrix.service.name }}:scan'
          format: 'sarif'
          output: 'trivy-container-${{ matrix.service.name }}.sarif'

      - name: Run Docker Scout scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: 'skillforge-${{ matrix.service.name }}:scan'
          format: sarif
          output: 'scout-${{ matrix.service.name }}.sarif'

      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: |
            trivy-container-${{ matrix.service.name }}.sarif
            scout-${{ matrix.service.name }}.sarif

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports-${{ matrix.service.name }}
          path: |
            trivy-container-${{ matrix.service.name }}.sarif
            scout-${{ matrix.service.name }}.sarif

  infrastructure-security-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.scan_type == 'full' || 
      github.event.inputs.scan_type == 'infrastructure-only' || 
      github.event.inputs.scan_type == '' ||
      github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Install security scanning tools
        run: |
          # Install tfsec
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          
          # Install Checkov
          pip install checkov
          
          # Install Terrascan
          curl -L "$(curl -s https://api.github.com/repos/tenable/terrascan/releases/latest | grep -o -E "https://.+?_Linux_x86_64.tar.gz")" > terrascan.tar.gz
          tar -xf terrascan.tar.gz terrascan && rm terrascan.tar.gz
          sudo install terrascan /usr/local/bin && rm terrascan

      - name: Run tfsec scan
        if: hashFiles('infrastructure/**/*.tf') != ''
        working-directory: infrastructure
        continue-on-error: true
        run: |
          tfsec . --format json --out tfsec-report.json || true
          tfsec . --format default

      - name: Run Checkov scan
        if: hashFiles('infrastructure/**/*.tf') != ''
        working-directory: infrastructure
        continue-on-error: true
        run: |
          checkov -d . --framework terraform --output json --output-file checkov-report.json || true
          checkov -d . --framework terraform

      - name: Run Terrascan
        if: hashFiles('infrastructure/**/*.tf') != ''
        working-directory: infrastructure
        continue-on-error: true
        run: |
          terrascan scan -t gcp -f json -o terrascan-report.json || true
          terrascan scan -t gcp

      - name: Scan GitHub Actions workflows
        run: |
          # Install actionlint
          bash <(curl https://raw.githubusercontent.com/rhymond/actionlint/main/scripts/download-actionlint.bash)
          
          # Scan all workflow files
          ./actionlint -format json -shellcheck= -pyflakes= .github/workflows/*.yml > actionlint-report.json || true
          ./actionlint .github/workflows/*.yml

      - name: Upload infrastructure security reports
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-security-reports
          path: |
            infrastructure/tfsec-report.json
            infrastructure/checkov-report.json
            infrastructure/terrascan-report.json
            actionlint-report.json

  secrets-scan:
    name: Secrets Detection Scan
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.scan_type == 'full' || 
      github.event.inputs.scan_type == 'code-only' || 
      github.event.inputs.scan_type == '' ||
      github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Run TruffleHog secrets scan
        run: |
          trufflehog git file://. --json --no-update > trufflehog-report.json || true
          trufflehog git file://. --no-update

      - name: Install and run GitLeaks
        run: |
          # Install GitLeaks
          wget https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz
          tar -xzf gitleaks_linux_x64.tar.gz
          chmod +x gitleaks
          
          # Run GitLeaks scan
          ./gitleaks detect --source . --format json --report-path gitleaks-report.json || true
          ./gitleaks detect --source . --verbose

      - name: Run detect-secrets
        run: |
          pip install detect-secrets
          
          # Initialize baseline if it doesn't exist
          if [ ! -f .secrets.baseline ]; then
            detect-secrets scan --all-files --disable-plugin AbsolutePathDetectorExperimental > .secrets.baseline
          fi
          
          # Run scan
          detect-secrets scan --baseline .secrets.baseline --all-files > detect-secrets-report.json || true

      - name: Upload secrets scan reports
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-reports
          path: |
            trufflehog-report.json
            gitleaks-report.json
            detect-secrets-report.json
            .secrets.baseline

  compliance-check:
    name: Compliance & Policy Check
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.scan_type == 'full' || 
      github.event.inputs.scan_type == '' ||
      github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GDPR compliance markers
        run: |
          echo "🔍 Checking for GDPR compliance markers..."
          
          # Look for GDPR-related code patterns
          GDPR_PATTERNS=(
            "gdpr"
            "personal.data"
            "data.subject"
            "consent"
            "right.to.be.forgotten"
            "data.portability"
          )
          
          for pattern in "${GDPR_PATTERNS[@]}"; do
            echo "Searching for: $pattern"
            grep -r -i "$pattern" apps/ --include="*.py" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" || true
          done

      - name: Check security headers configuration
        run: |
          echo "🔍 Checking security headers configuration..."
          
          # Look for security headers in configuration files
          SECURITY_HEADERS=(
            "X-Frame-Options"
            "X-Content-Type-Options"
            "X-XSS-Protection"
            "Strict-Transport-Security"
            "Content-Security-Policy"
            "Referrer-Policy"
          )
          
          for header in "${SECURITY_HEADERS[@]}"; do
            echo "Searching for: $header"
            grep -r -i "$header" . --exclude-dir=node_modules --exclude-dir=.git || true
          done

      - name: Check for sensitive file patterns
        run: |
          echo "🔍 Checking for sensitive file patterns..."
          
          SENSITIVE_PATTERNS=(
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
            "id_rsa"
            "id_dsa"
            ".env"
            "*.env"
            "docker-compose.yml"
            "docker-compose.yaml"
          )
          
          for pattern in "${SENSITIVE_PATTERNS[@]}"; do
            echo "Searching for files matching: $pattern"
            find . -name "$pattern" -not -path "./.git/*" -not -path "./node_modules/*" || true
          done

      - name: Check database migration security
        run: |
          echo "🔍 Checking database migration security..."
          
          # Look for potentially dangerous migration patterns
          find . -name "*.py" -path "*/alembic/versions/*" -exec grep -l "DROP\|DELETE\|TRUNCATE" {} \; || true

      - name: Generate compliance report
        run: |
          cat > compliance-report.md << EOF
          # SkillForge AI Compliance Report
          
          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Scan Type**: ${{ github.event.inputs.scan_type || 'full' }}
          **Triggered By**: ${{ github.actor || 'system' }}
          
          ## Security Standards Compliance
          
          - ✅ Code security scanning: COMPLETED
          - ✅ Dependency vulnerability scanning: COMPLETED
          - ✅ Container security scanning: COMPLETED
          - ✅ Infrastructure security scanning: COMPLETED
          - ✅ Secrets detection: COMPLETED
          - ✅ GDPR compliance check: COMPLETED
          
          ## Recommendations
          
          1. Regularly update dependencies to latest secure versions
          2. Implement security headers in all web applications
          3. Ensure proper data handling for GDPR compliance
          4. Regular security training for development team
          5. Implement automated security testing in CI/CD pipeline
          
          ## Next Actions
          
          - Review and remediate any high/critical findings
          - Update security policies as needed
          - Schedule next compliance review
          
          ---
          Generated by SkillForge AI Security Validation Workflow
          EOF

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report.md

  generate-security-summary:
    name: Generate Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-quality-scan, container-security-scan, infrastructure-security-scan, secrets-scan, compliance-check]
    if: always()
    steps:
      - name: Download all security reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate security summary
        run: |
          echo "📊 Generating comprehensive security summary..."
          
          cat > security-summary.md << EOF
          # SkillForge AI Security Validation Summary
          
          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow Run**: ${{ github.run_id }}
          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
          
          ## Scan Results Overview
          
          | Scan Type | Status | Files Scanned |
          |-----------|---------|---------------|
          | Dependency Security | ${{ needs.dependency-scan.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | $(find security-reports -name "*dependency*" -type f | wc -l) |
          | Code Quality & Security | ${{ needs.code-quality-scan.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | $(find security-reports -name "*code-quality*" -type f | wc -l) |
          | Container Security | ${{ needs.container-security-scan.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | $(find security-reports -name "*container*" -type f | wc -l) |
          | Infrastructure Security | ${{ needs.infrastructure-security-scan.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | $(find security-reports -name "*infrastructure*" -type f | wc -l) |
          | Secrets Detection | ${{ needs.secrets-scan.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | $(find security-reports -name "*secrets*" -type f | wc -l) |
          | Compliance Check | ${{ needs.compliance-check.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | $(find security-reports -name "*compliance*" -type f | wc -l) |
          
          ## Security Score
          
          Based on the scan results, the overall security score is:
          
          EOF
          
          # Calculate security score
          PASSED_SCANS=0
          TOTAL_SCANS=6
          
          [[ "${{ needs.dependency-scan.result }}" == "success" ]] && ((PASSED_SCANS++))
          [[ "${{ needs.code-quality-scan.result }}" == "success" ]] && ((PASSED_SCANS++))
          [[ "${{ needs.container-security-scan.result }}" == "success" ]] && ((PASSED_SCANS++))
          [[ "${{ needs.infrastructure-security-scan.result }}" == "success" ]] && ((PASSED_SCANS++))
          [[ "${{ needs.secrets-scan.result }}" == "success" ]] && ((PASSED_SCANS++))
          [[ "${{ needs.compliance-check.result }}" == "success" ]] && ((PASSED_SCANS++))
          
          SCORE=$((PASSED_SCANS * 100 / TOTAL_SCANS))
          
          if [[ $SCORE -ge 90 ]]; then
            echo "🟢 **$SCORE%** - Excellent security posture" >> security-summary.md
          elif [[ $SCORE -ge 70 ]]; then
            echo "🟡 **$SCORE%** - Good security posture with room for improvement" >> security-summary.md
          else
            echo "🔴 **$SCORE%** - Security improvements required" >> security-summary.md
          fi
          
          cat >> security-summary.md << EOF
          
          ## Next Steps
          
          1. Review detailed scan reports in the artifacts
          2. Address any critical or high severity findings
          3. Update security documentation
          4. Schedule follow-up scans after remediation
          
          ## Artifact Files Generated
          
          EOF
          
          # List all generated artifacts
          find security-reports -type f -name "*.json" -o -name "*.sarif" -o -name "*.md" | sort >> security-summary.md
          
          echo "Security summary generated successfully"

      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md

      - name: Set security status
        id: security-status
        run: |
          PASSED_SCANS=0
          TOTAL_SCANS=6
          
          [[ "${{ needs.dependency-scan.result }}" == "success" ]] && ((PASSED_SCANS++))
          [[ "${{ needs.code-quality-scan.result }}" == "success" ]] && ((PASSED_SCANS++))
          [[ "${{ needs.container-security-scan.result }}" == "success" ]] && ((PASSED_SCANS++))
          [[ "${{ needs.infrastructure-security-scan.result }}" == "success" ]] && ((PASSED_SCANS++))
          [[ "${{ needs.secrets-scan.result }}" == "success" ]] && ((PASSED_SCANS++))
          [[ "${{ needs.compliance-check.result }}" == "success" ]] && ((PASSED_SCANS++))
          
          SCORE=$((PASSED_SCANS * 100 / TOTAL_SCANS))
          
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "passed_scans=$PASSED_SCANS" >> $GITHUB_OUTPUT
          echo "total_scans=$TOTAL_SCANS" >> $GITHUB_OUTPUT

      - name: Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  notify-security-results:
    name: Notify Security Results
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-quality-scan, container-security-scan, infrastructure-security-scan, secrets-scan, compliance-check, generate-security-summary]
    if: always()
    steps:
      - name: Determine notification urgency
        id: urgency
        run: |
          FAILED_SCANS=()
          [[ "${{ needs.dependency-scan.result }}" != "success" ]] && FAILED_SCANS+=("Dependency")
          [[ "${{ needs.code-quality-scan.result }}" != "success" ]] && FAILED_SCANS+=("Code Quality")
          [[ "${{ needs.container-security-scan.result }}" != "success" ]] && FAILED_SCANS+=("Container")
          [[ "${{ needs.infrastructure-security-scan.result }}" != "success" ]] && FAILED_SCANS+=("Infrastructure")
          [[ "${{ needs.secrets-scan.result }}" != "success" ]] && FAILED_SCANS+=("Secrets")
          [[ "${{ needs.compliance-check.result }}" != "success" ]] && FAILED_SCANS+=("Compliance")
          
          if [[ ${#FAILED_SCANS[@]} -eq 0 ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "urgency=low" >> $GITHUB_OUTPUT
            echo "message=All security scans passed successfully" >> $GITHUB_OUTPUT
          elif [[ ${#FAILED_SCANS[@]} -le 2 ]]; then
            echo "status=warning" >> $GITHUB_OUTPUT
            echo "urgency=medium" >> $GITHUB_OUTPUT
            echo "message=Some security scans failed: ${FAILED_SCANS[*]}" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "urgency=high" >> $GITHUB_OUTPUT
            echo "message=Multiple security scans failed: ${FAILED_SCANS[*]}" >> $GITHUB_OUTPUT
          fi

      - name: Notify via Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.urgency.outputs.status }}
          custom_payload: |
            {
              "text": "${{ steps.urgency.outputs.status == 'success' && '🔒✅' || steps.urgency.outputs.status == 'warning' && '🔒⚠️' || '🔒❌' }} Security Validation Results",
              "attachments": [
                {
                  "color": "${{ steps.urgency.outputs.status == 'success' && 'good' || steps.urgency.outputs.status == 'warning' && 'warning' || 'danger' }}",
                  "fields": [
                    {
                      "title": "Status",
                      "value": "${{ steps.urgency.outputs.message }}",
                      "short": false
                    },
                    {
                      "title": "Urgency Level",
                      "value": "${{ steps.urgency.outputs.urgency }}",
                      "short": true
                    },
                    {
                      "title": "Scan Type",
                      "value": "${{ github.event.inputs.scan_type || 'full' }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Triggered By",
                      "value": "${{ github.event_name == 'schedule' && 'Scheduled' || github.actor }}",
                      "short": true
                    },
                    {
                      "title": "Workflow Details",
                      "value": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Full Report>",
                      "short": false
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}