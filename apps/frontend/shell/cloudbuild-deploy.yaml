steps:
# Build et tag de l'image Docker
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '-t'
    - 'gcr.io/${PROJECT_ID}/skillforge-shell:${BUILD_ID}'
    - '-t'
    - 'gcr.io/${PROJECT_ID}/skillforge-shell:latest'
    - '-f'
    - 'apps/frontend/shell/Dockerfile.working'
    - 'apps/frontend/shell'
  timeout: '1200s'

# Push des images vers Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${PROJECT_ID}/skillforge-shell:${BUILD_ID}']
  timeout: '600s'

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${PROJECT_ID}/skillforge-shell:latest']
  timeout: '600s'

# Déployer vers Cloud Run
- name: 'gcr.io/cloud-builders/gcloud'
  args:
    - 'run'
    - 'deploy'
    - 'skillforge-shell-staging'
    - '--image=gcr.io/${PROJECT_ID}/skillforge-shell:${BUILD_ID}'
    - '--region=us-central1'
    - '--platform=managed'
    - '--allow-unauthenticated'
    - '--port=80'
    - '--memory=512Mi'
    - '--cpu=1'
    - '--min-instances=0'
    - '--max-instances=10'
    - '--concurrency=1000'
    - '--set-env-vars=ENVIRONMENT=staging'
    - '--ingress=all'
    - '--execution-environment=gen2'
  timeout: '1200s'

# Afficher l'URL de déploiement
- name: 'gcr.io/cloud-builders/gcloud'
  args:
    - 'run'
    - 'services'
    - 'describe'
    - 'skillforge-shell-staging'
    - '--region=us-central1'
    - '--format=value(status.url)'
  timeout: '60s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'

timeout: '3600s'