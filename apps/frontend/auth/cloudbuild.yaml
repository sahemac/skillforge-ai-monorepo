steps:
  # Build de l'image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-f'
      - 'apps/frontend/auth/Dockerfile'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/skillforge-auth-frontend:$BUILD_ID'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/skillforge-auth-frontend:latest'
      - '.'

  # Push des images
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/skillforge-auth-frontend:$BUILD_ID'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/skillforge-auth-frontend:latest'

  # Déploiement sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'skillforge-auth-frontend-staging'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/skillforge-auth-frontend:$BUILD_ID'
      - '--platform=managed'
      - '--region=europe-west1'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300'
      - '--ingress=all'
      - '--set-env-vars=NODE_ENV=production,APP_TYPE=auth,MODULE_FEDERATION_REMOTE=true'
      - '--labels=app=skillforge,component=frontend,type=auth,environment=staging'
      - '--quiet'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/skillforge-auth-frontend:$BUILD_ID'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/skillforge-auth-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'

timeout: '1800s'