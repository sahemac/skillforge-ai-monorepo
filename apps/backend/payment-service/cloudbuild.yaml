# SkillForge AI - Standard Cloud Build Configuration
# Template pour tous les services (frontend et backend)
# Variables à configurer par service via substitutions

substitutions:
  _SERVICE_NAME: "${SERVICE_NAME}"
  _SERVICE_TYPE: "${SERVICE_TYPE}"  # frontend ou backend
  _IMAGE_NAME: "europe-west1-docker.pkg.dev/skillforge-ai-mvp-25/skillforge-docker-repo-staging/${_SERVICE_NAME}:${BUILD_ID}"
  _DOCKERFILE: "Dockerfile.final"
  _PORT: "8080"
  _CPU: "1000m"
  _MEMORY: "512Mi"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "100"
  _CONCURRENCY: "80"

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - '${_DOCKERFILE}'
      - '-t'
      - '${_IMAGE_NAME}'
      - '.'
    env:
      - 'SERVICE_NAME=${_SERVICE_NAME}'
      - 'SERVICE_TYPE=${_SERVICE_TYPE}'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE_NAME}'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_IMAGE_NAME}'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '${_PORT}'
      - '--cpu'
      - '${_CPU}'
      - '--memory'
      - '${_MEMORY}'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--concurrency'
      - '${_CONCURRENCY}'
      - '--timeout'
      - '300'
      - '--project'
      - 'skillforge-ai-mvp-25'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '600s'