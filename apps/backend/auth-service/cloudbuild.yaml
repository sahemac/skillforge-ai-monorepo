steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-registry/auth-service:$COMMIT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-registry/auth-service:latest'
      - '.'

  # Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-registry/auth-service'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'auth-service'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-registry/auth-service:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,USE_SECRET_MANAGER=true,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=europe-west1,ENABLE_METRICS=true,LOG_LEVEL=INFO,ALGORITHM=HS256,ACCESS_TOKEN_EXPIRE_MINUTES=30,REFRESH_TOKEN_EXPIRE_DAYS=7,RATE_LIMIT_PER_MINUTE=60,AUTH_RATE_LIMIT_PER_MINUTE=5,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_USER=libressai@gmail.com,FROM_EMAIL=libressai@gmail.com,FROM_NAME=SkillForge AI'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest'
      - '--add-cloudsql-instances'
      - 'skillforge-ai-mvp-25:europe-west1:skillforge-pg-instance-staging'
      - '--service-account'
      - 'auth-service@skillforge-ai-mvp-25.iam.gserviceaccount.com'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--cpu-boost'
      - '--timeout'
      - '600s'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-registry/auth-service:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-registry/auth-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
