steps:
  # Build the image with proper context from repository root
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-f'
      - 'apps/backend/evaluation-service/Dockerfile'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/evaluation-service:$BUILD_ID'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/evaluation-service:latest'
      - '.'

  # Push the images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/evaluation-service:$BUILD_ID'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/evaluation-service:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - ${_SERVICE_NAME}
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/evaluation-service:$BUILD_ID'
      - '--platform=managed'
      - '--region=europe-west1'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300'
      - '--ingress=internal-and-cloud-load-balancing'
      # Configuration des variables d'environnement sécurisées
      - '--set-env-vars=ENVIRONMENT=production,SERVICE_NAME=evaluation-service,POSTGRES_HOST=127.0.0.1,POSTGRES_PORT=5432,POSTGRES_DB=skillforge_db,POSTGRES_USER=skillforge_user'
      # Référence au secret pour le mot de passe PostgreSQL
      - '--set-secrets=POSTGRES_PASSWORD=postgres-password:latest'
      # Configuration de l'URL de base de données (le mot de passe sera injecté automatiquement)
      - '--update-env-vars=DATABASE_URL=postgresql+asyncpg://skillforge_user:$${POSTGRES_PASSWORD}@127.0.0.1:5432/skillforge_db'
      # Configuration Cloud SQL Proxy
      - '--add-cloudsql-instances=skillforge-ai-mvp-25:europe-west1:skillforge-pg-instance-staging'
      - '--labels=app=skillforge,component=backend,service=evaluation,environment=production'
      - '--quiet'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/evaluation-service:$BUILD_ID'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/evaluation-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'

timeout: '1800s'

substitutions:
  _SERVICE_NAME: 'evaluation-service'
