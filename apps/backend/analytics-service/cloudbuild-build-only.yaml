steps:
  # Build the image with proper context from repository root
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-f'
      - 'apps/backend/analytics-service/Dockerfile'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-docker-repo-staging/analytics-service:$BUILD_ID'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-docker-repo-staging/analytics-service:latest'
      - '.'
    timeout: '1200s'

  # Push the images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-docker-repo-staging/analytics-service:$BUILD_ID'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-docker-repo-staging/analytics-service:latest'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-docker-repo-staging/analytics-service:$BUILD_ID'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-docker-repo-staging/analytics-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'

timeout: '1800s'