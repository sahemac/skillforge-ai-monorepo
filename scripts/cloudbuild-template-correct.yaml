steps:
  # Build the image with proper context from repository root
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-f'
      - 'apps/backend/${_SERVICE_NAME}/Dockerfile'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/${_SERVICE_NAME}:latest'
      - '.'
    timeout: '1200s'

  # Push the images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/${_SERVICE_NAME}:$BUILD_ID'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/${_SERVICE_NAME}:latest'

  # Deploy to Cloud Run with CORRECT settings
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/${_SERVICE_NAME}:$BUILD_ID'
      - '--platform=managed'
      - '--region=europe-west1'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300'
      - '--ingress=internal-and-cloud-load-balancing'  # CORRECTION CRITIQUE
      - '--set-env-vars=ENVIRONMENT=production,SERVICE_NAME=${_SERVICE_NAME},POSTGRES_HOST=127.0.0.1,POSTGRES_PORT=5432,POSTGRES_DB=skillforge_db,POSTGRES_USER=skillforge_user,POSTGRES_PASSWORD=Psaumes@27,DATABASE_URL=postgresql+asyncpg://skillforge_user:Psaumes@27@127.0.0.1:5432/skillforge_db'
      - '--labels=app=skillforge,component=backend,service=${_SERVICE_NAME},environment=production'
      - '--quiet'

substitutions:
  _SERVICE_NAME: 'service-name'  # À remplacer par le nom du service

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/${_SERVICE_NAME}:$BUILD_ID'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'

timeout: '1800s'