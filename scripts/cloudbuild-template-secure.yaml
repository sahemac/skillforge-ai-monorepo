# Template cloudbuild.yaml sécurisé avec Secrets Manager et Cloud SQL Proxy
# Pour les services SkillForge AI
# 
# Instructions d'utilisation:
# 1. Remplacer {SERVICE_NAME} par le nom du service (ex: user-service)
# 2. Remplacer {SERVICE_LABEL} par le label du service (ex: user)
# 3. Copier ce template vers apps/backend/{SERVICE_NAME}/cloudbuild.yaml

steps:
  # Build the image with proper context from repository root
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-f'
      - 'apps/backend/{SERVICE_NAME}/Dockerfile'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/{SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/{SERVICE_NAME}:latest'
      - '.'

  # Push the images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/{SERVICE_NAME}:$BUILD_ID'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/{SERVICE_NAME}:latest'

  # Deploy to Cloud Run with Secrets Manager and Cloud SQL Proxy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - ${_SERVICE_NAME}
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/{SERVICE_NAME}:$BUILD_ID'
      - '--platform=managed'
      - '--region=europe-west1'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300'
      - '--ingress=internal-and-cloud-load-balancing'
      # Configuration des variables d'environnement sécurisées
      - '--set-env-vars=ENVIRONMENT=production,SERVICE_NAME={SERVICE_NAME},POSTGRES_HOST=127.0.0.1,POSTGRES_PORT=5432,POSTGRES_DB=skillforge_db,POSTGRES_USER=skillforge_user'
      # Référence au secret pour le mot de passe PostgreSQL
      - '--set-secrets=POSTGRES_PASSWORD=postgres-password:latest'
      # Configuration de l'URL de base de données (le mot de passe sera injecté automatiquement)
      - '--update-env-vars=DATABASE_URL=postgresql+asyncpg://skillforge_user:$${POSTGRES_PASSWORD}@127.0.0.1:5432/skillforge_db'
      # Configuration Cloud SQL Proxy
      - '--add-cloudsql-instances=skillforge-ai-mvp-25:europe-west1:skillforge-pg-instance-staging'
      # Labels
      - '--labels=app=skillforge,component=backend,service={SERVICE_LABEL},environment=production'
      - '--quiet'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/{SERVICE_NAME}:$BUILD_ID'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillforge-ai-registry/{SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'

timeout: '1800s'

substitutions:
  _SERVICE_NAME: '{SERVICE_NAME}'

# Configuration de sécurité:
# - Le mot de passe PostgreSQL est stocké dans Secrets Manager
# - Cloud SQL Proxy est automatiquement configuré
# - Connexion sécurisée à la base de données via 127.0.0.1
# - Variables d'environnement limitées aux informations non-sensibles